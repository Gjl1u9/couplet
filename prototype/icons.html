<!doctype html>
<html lang="zh-Hant" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>幾何 icon 套組</title>
    <link rel="stylesheet" href="./tokens.css" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: var(--space-6) var(--space-4);
        background: var(--ground);
        color: var(--ink);
        font-family: var(--font-sans);
      }

      main {
        display: grid;
        gap: var(--space-5);
        max-width: 1040px;
        margin: 0 auto;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1,
      h2 {
        font-size: 20px;
        font-weight: 600;
        line-height: 28px;
      }

      .note {
        margin-top: var(--space-1);
        color: var(--ink-muted);
        font-size: 14px;
        line-height: 21px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(236px, 1fr));
        gap: var(--space-3);
        margin-top: var(--space-3);
      }

      .tile {
        display: grid;
        gap: var(--space-3);
        padding: var(--space-4);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
      }

      .tile-top {
        display: flex;
        align-items: center;
        gap: var(--space-3);
      }

      .feature {
        display: grid;
        flex: none;
        place-items: center;
        width: 64px;
        height: 64px;
        background: var(--chip);
        border-radius: var(--radius-md);
        color: var(--ink);
      }

      .name {
        font-size: 14px;
        font-weight: 600;
        line-height: 20px;
      }

      .term {
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 16px;
      }

      .samples {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-2);
      }

      .sample {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-4);
        height: 40px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--ink);
      }

      .icon {
        flex: none;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon .soft {
        opacity: 0.38;
      }

      /* Small sizes draw both layers at full strength. */
      .icon-line .soft {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>

    <script>
      // Same format as ICONS in src/lib/dashboard/Icon.tsx. `soft` is the
      // second layer: full strength at small sizes, lighter on feature tiles.
      const existing = [
        {
          id: 'home',
          zh: '首頁',
          paths: [
            'M5 12h-2l9 -9l9 9h-2',
            'M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7',
            'M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6',
          ],
        },
        {
          id: 'review',
          zh: '複習',
          paths: [
            'M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z',
            'M8 21h8',
          ],
        },
        { id: 'words', zh: '單字', paths: ['M5 6h14', 'M5 12h14', 'M5 18h9'] },
        {
          id: 'progress',
          zh: '進度',
          paths: ['M4 20h16', 'M7 20v-6', 'M12 20v-11', 'M17 20v-15'],
        },
        {
          id: 'settings',
          zh: '設定',
          paths: [
            'M4 7h9',
            'M17 7h3',
            'M15 5v4',
            'M4 17h3',
            'M11 17h9',
            'M9 15v4',
          ],
        },
      ];

      const dot = (x, y) => `M${x - 0.5} ${y}a.5 .5 0 1 0 1 0a.5 .5 0 1 0 -1 0`;

      const fresh = [
        {
          id: 'dual-subtitles',
          zh: '雙語字幕',
          term: 'Dual Subtitles',
          paths: [
            'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2z',
            'M7 10h10',
          ],
          soft: ['M7 14h6'],
        },
        {
          id: 'lookup',
          zh: '查字',
          term: 'Lookup',
          paths: ['M4 11a7 7 0 1 0 14 0a7 7 0 1 0 -14 0', 'M16 16l4.5 4.5'],
          soft: ['M8 11h6'],
        },
        {
          id: 'vocabulary',
          zh: '單字庫',
          term: 'Vocabulary',
          paths: [
            'M4 9a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2z',
            'M8 14h8',
          ],
          soft: ['M7 3.5h10'],
        },
        {
          id: 'pronunciation',
          zh: '發音',
          term: 'Pronunciation',
          paths: ['M8 7v10', 'M12 4v16', 'M16 9v6'],
          soft: ['M4 10v4', 'M20 10v4'],
        },
        {
          id: 'context-lines',
          zh: '上下句',
          term: 'Context Line',
          paths: [
            'M6 8.5h12a2 2 0 0 1 2 2v3a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-3a2 2 0 0 1 2 -2z',
          ],
          soft: ['M7 3.5h10', 'M7 20.5h10'],
        },
        {
          id: 'grip',
          zh: '移動握把',
          term: 'Grip',
          paths: [
            dot(9, 6),
            dot(15, 6),
            dot(9, 12),
            dot(15, 12),
            dot(9, 18),
            dot(15, 18),
          ],
        },
        {
          id: 'subtitle-switch',
          zh: '字幕開關',
          term: 'Subtitle Switch',
          paths: [
            'M7 7h10a5 5 0 0 1 0 10h-10a5 5 0 0 1 0 -10z',
            'M14.5 12a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0 -3 0',
          ],
        },
        {
          id: 'streak',
          zh: '連續天數',
          term: 'Encounter',
          paths: [
            'M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2z',
            'M8 3v4',
            'M16 3v4',
            'M3 11h18',
          ],
          soft: ['M7.5 16h1', 'M11.5 16h1', 'M15.5 16h1'],
          smallSoft: false,
        },
        {
          id: 'level',
          zh: '程度',
          term: 'Level',
          paths: ['M12 3a9 9 0 1 1 -9 9', 'M12 12l3.5 -3.5'],
          soft: ['M3 12a9 9 0 0 1 9 -9'],
          smallSoft: false,
        },
        {
          id: 'account',
          zh: '帳號',
          term: 'Account',
          paths: ['M8.5 8a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0'],
          soft: ['M5 20a7 7 0 0 1 14 0'],
        },
        {
          id: 'languages',
          zh: '語言',
          term: 'Learning / Native Language',
          paths: ['M3 12a6 6 0 1 0 12 0a6 6 0 1 0 -12 0'],
          soft: ['M9 12a6 6 0 1 0 12 0a6 6 0 1 0 -12 0'],
        },
        {
          id: 'selection',
          zh: '框選',
          term: 'Selection',
          paths: [
            'M4 8v-2a2 2 0 0 1 2 -2h2',
            'M16 4h2a2 2 0 0 1 2 2v2',
            'M20 16v2a2 2 0 0 1 -2 2h-2',
            'M8 20h-2a2 2 0 0 1 -2 -2v-2',
          ],
          soft: ['M8 12h8'],
        },
      ];

      const layer = (list, cls = '') =>
        list?.length
          ? `<g${cls ? ` class="${cls}"` : ''}>${list
              .map((d) => `<path d="${d}"/>`)
              .join('')}</g>`
          : '';

      const svg = (icon, size, stroke, line) =>
        `<svg class="icon ${line ? 'icon-line' : ''}" width="${size}" height="${size}" viewBox="0 0 24 24" stroke-width="${stroke}" aria-hidden="true">${layer(
          icon.paths,
        )}${line && icon.smallSoft === false ? '' : layer(icon.soft, 'soft')}</svg>`;

      const tile = (icon) => `
        <article class="tile" data-icon="${icon.id}">
          <div class="tile-top">
            <div class="feature" role="img" aria-label="${icon.zh}">${svg(icon, 40, 1.5, false)}</div>
            <div>
              <div class="name">${icon.zh}</div>
              <div class="term">${icon.term ?? icon.id}</div>
            </div>
          </div>
          <div class="samples">
            <div class="sample" data-theme="light">${svg(icon, 20, 1.8, true)}${svg(icon, 16, 2, true)}</div>
            <div class="sample" data-theme="dark">${svg(icon, 20, 1.8, true)}${svg(icon, 16, 2, true)}</div>
          </div>
        </article>`;

      const section = (title, note, icons) => `
        <section>
          <h2>${title}</h2>
          <p class="note">${note}</p>
          <div class="grid">${icons.map(tile).join('')}</div>
        </section>`;

      document.getElementById('app').innerHTML = `
        <header>
          <h1>幾何 icon 套組</h1>
          <p class="note">
            24 格畫布、圓頭線條、顏色繼承文字，格式和 Icon.tsx 的 ICONS 相同。
            每張卡片上方是 48 級功能卡片版（淺線降低透明度），下方是 20px 和 16px 在淺色與深色底上的樣子。
          </p>
        </header>
        ${section('已有（對照用）', '現在 Dashboard 在用的五個，新的一套要能和它們放在一起。', existing)}
        ${section('新的一套', '朱紅不放進 icon，照原則一只留給正在看的那個字。', fresh)}`;
    </script>
  </body>
</html>
