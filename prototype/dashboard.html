<!doctype html>
<html lang="en" data-theme="light" data-accent="vermilion" data-style="paper">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard prototype</title>
    <style>
      :root,
      [data-theme='light'] {
        color-scheme: light;
        --ground: #f5f6f8;
        --surface: #ffffff;
        --ink: #171a21;
        --ink-muted: #5d6470;
        --line: #e6e8ec;
        --line-strong: #8a919c;
        --chip: #f0f1f4;
        --skeleton: #dfe2e7;
        --stage-new: #a3aab5;
        --stage-learning: #e0a030;
        --stage-known: #2f9e6e;
        --danger: #b42318;
        --danger-soft: #fdecea;
        --shadow:
          0 1px 2px rgba(23, 26, 33, 0.04), 0 8px 24px rgba(23, 26, 33, 0.05);
        --pop-shadow: 0 16px 40px rgba(23, 26, 33, 0.18);
      }

      [data-theme='dark'] {
        color-scheme: dark;
        --ground: #101216;
        --surface: #1a1d23;
        --ink: #eff1f4;
        --ink-muted: #a6adb8;
        --line: #2c3038;
        --line-strong: #79808c;
        --chip: #262a31;
        --skeleton: #2c3038;
        --stage-new: #79808c;
        --stage-learning: #e8b04a;
        --stage-known: #4cc08e;
        --danger: #ff8a80;
        --danger-soft: #3b2220;
        --shadow: none;
        --pop-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      }

      [data-accent='vermilion'] {
        --accent: #c9401f;
        --on-accent: #ffffff;
        --accent-soft: #fcece7;
      }

      [data-theme='dark'][data-accent='vermilion'] {
        --accent: #ff8363;
        --on-accent: #1a1d23;
        --accent-soft: #3a241e;
      }

      [data-accent='indigo'] {
        --accent: #4f46d8;
        --on-accent: #ffffff;
        --accent-soft: #ecebfc;
      }

      [data-theme='dark'][data-accent='indigo'] {
        --accent: #a5a0ff;
        --on-accent: #1a1d23;
        --accent-soft: #2a2845;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: var(--ground);
        color: var(--ink);
        font-family:
          'IBM Plex Sans',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      button,
      input {
        color: inherit;
        font: inherit;
      }

      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      [tabindex]:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      .icon {
        flex: none;
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .visually-hidden {
        position: absolute;
        overflow: hidden;
        width: 1px;
        height: 1px;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* Shell */
      .app {
        display: grid;
        grid-template-columns: 84px minmax(0, 1fr);
        min-height: 100dvh;
      }

      .rail {
        position: sticky;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        height: 100dvh;
        padding: 16px 8px;
      }

      .rail-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        width: 68px;
        padding: 8px 0 6px;
        border: 0;
        border-radius: 14px;
        background: none;
        color: var(--ink-muted);
        font-size: 11px;
        font-weight: 500;
        line-height: 14px;
        text-decoration: none;
        cursor: pointer;
      }

      .rail-item:hover {
        background: var(--chip);
        color: var(--ink);
      }

      .rail-item[aria-current='page'] {
        background: var(--surface);
        box-shadow: var(--shadow);
        color: var(--accent);
        font-weight: 600;
      }

      .rail-badge {
        position: absolute;
        top: 3px;
        right: 12px;
        min-width: 17px;
        padding-inline: 4px;
        border-radius: 9px;
        background: var(--accent);
        color: var(--on-accent);
        font-size: 10px;
        font-weight: 700;
        line-height: 17px;
        text-align: center;
      }

      .rail-end {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        margin-top: auto;
      }

      main {
        min-width: 0;
        padding: 32px 32px 48px 8px;
      }

      .page {
        width: 100%;
        max-width: 880px;
        margin-inline: auto;
      }

      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 26px;
        font-weight: 650;
        letter-spacing: -0.01em;
        line-height: 34px;
      }

      h2 {
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      .muted {
        color: var(--ink-muted);
        font-size: 13px;
        line-height: 20px;
      }

      /* Cards */
      .card {
        min-width: 0;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 16px;
      }

      .span-2 {
        grid-column: span 2;
      }

      .span-3 {
        grid-column: span 3;
      }

      .span-6 {
        grid-column: span 6;
      }

      .card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 16px;
      }

      /* Controls */
      .button {
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--line-strong);
        border-radius: 14px;
        background: var(--surface);
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        color: var(--ink);
      }

      .button:hover {
        background: var(--chip);
      }

      .button.is-primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--on-accent);
      }

      .button.is-primary:hover {
        opacity: 0.9;
      }

      /* The shape hugs the text, and ::after keeps a 44px hit area. */
      .text-button {
        position: relative;
        display: inline-flex;
        flex: none;
        align-items: center;
        gap: 4px;
        margin-inline: -4px;
        padding: 2px 4px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        text-decoration: none;
        cursor: pointer;
      }

      .text-button::after {
        content: '';
        position: absolute;
        inset: -10px 0;
      }

      .text-button:hover {
        background: var(--chip);
        color: var(--ink);
      }

      .text-button.is-accent {
        color: var(--accent);
      }

      .text-button.is-accent:hover {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .action {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 14px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: var(--surface);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .action .icon {
        width: 16px;
        height: 16px;
      }

      .action:not(.is-danger) .icon {
        color: var(--stage-known);
      }

      .action:hover {
        background: var(--chip);
      }

      .action.is-danger {
        border-color: var(--danger);
        color: var(--danger);
      }

      .action.is-danger:hover {
        background: var(--danger-soft);
      }

      .text-button .icon {
        width: 16px;
        height: 16px;
      }

      .icon-button {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink-muted);
        cursor: pointer;
      }

      .icon-button::before {
        content: '';
        position: absolute;
        z-index: -1;
        top: 50%;
        left: 50%;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        transform: translate(-50%, -50%);
      }

      .icon-button:hover::before {
        background: var(--chip);
      }

      .icon-button:hover,
      .icon-button[aria-expanded='true'] {
        color: var(--ink);
      }

      .icon-button:focus-visible {
        outline: none;
      }

      .icon-button:focus-visible::before {
        outline: 2px solid var(--accent);
      }

      .stage {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        white-space: nowrap;
      }

      .stage-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      .is-new {
        background: var(--stage-new);
      }

      .is-learning {
        background: var(--stage-learning);
      }

      .is-known {
        background: var(--stage-known);
      }

      .level {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 500;
        line-height: 16px;
      }

      .level-dots {
        display: inline-flex;
        gap: 3px;
      }

      .level-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--line);
      }

      .level-dots .is-on {
        background: var(--accent);
      }

      /* Home */
      .hero {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 32px;
      }

      .hero-count {
        font-size: 44px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 52px;
      }

      .hero .button {
        min-height: 52px;
        padding-inline: 28px;
        font-size: 15px;
      }

      .stat-value {
        margin-top: 4px;
        font-size: 28px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        line-height: 36px;
      }

      .list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .row-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 48px;
        color: inherit;
        text-decoration: none;
      }

      /* The row is the hit area; only the word reacts, so nothing touches the dividers. */
      .row-link:hover .row-word {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .list-head {
        margin-bottom: 4px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .list-rows li + li {
        border-top: 1px solid var(--line);
      }

      .forget-count {
        flex: none;
        padding: 1px 8px;
        border-radius: 10px;
        background: var(--danger-soft);
        color: var(--danger);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
        white-space: nowrap;
      }

      .row-word {
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      /* Progress */
      .big-number {
        font-size: 44px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 52px;
      }

      .stage-bar {
        display: flex;
        gap: 3px;
        height: 14px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 7px;
      }

      .stage-bar span {
        min-width: 4px;
      }

      .stage-links {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 24px;
        margin-top: 14px;
      }

      .ladder {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr) 24px;
        align-items: center;
        gap: 8px 10px;
        font-size: 13px;
        line-height: 20px;
      }

      .ladder-track {
        height: 10px;
        overflow: hidden;
        border-radius: 5px;
        background: var(--chip);
      }

      .ladder-track span {
        display: block;
        height: 100%;
        border-radius: 5px;
      }

      .ladder-count {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        text-align: right;
      }

      .forecast {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 6px;
      }

      .forecast-plot {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        height: 100px;
      }

      .forecast-plot span {
        position: relative;
        display: block;
        width: min(100%, 22px);
        border-radius: 7px;
        background: var(--line-strong);
        opacity: 0.55;
      }

      .forecast-day.is-today .forecast-plot span {
        background: var(--accent);
        opacity: 1;
      }

      .forecast-plot b {
        position: absolute;
        bottom: 100%;
        left: 50%;
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
        transform: translateX(-50%);
      }

      .forecast-name {
        display: block;
        margin-top: 6px;
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 16px;
        text-align: center;
      }

      .trail {
        display: grid;
        grid-auto-columns: 15px;
        grid-auto-flow: column;
        grid-template-rows: repeat(7, 15px);
        gap: 4px;
        width: fit-content;
      }

      .trail span {
        border-radius: 4px;
        background: var(--chip);
      }

      .trail span.is-future {
        background: none;
      }

      .trail span.is-1 {
        background: color-mix(in srgb, var(--accent) 28%, var(--surface));
      }

      .trail span.is-2 {
        background: color-mix(in srgb, var(--accent) 52%, var(--surface));
      }

      .trail span.is-3 {
        background: color-mix(in srgb, var(--accent) 76%, var(--surface));
      }

      .trail span.is-4 {
        background: var(--accent);
      }

      .trail-legend {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 12px;
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 16px;
      }

      .trail-legend i {
        display: block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: var(--chip);
      }

      .trail-legend i.is-1 {
        background: color-mix(in srgb, var(--accent) 28%, var(--surface));
      }

      .trail-legend i.is-2 {
        background: color-mix(in srgb, var(--accent) 52%, var(--surface));
      }

      .trail-legend i.is-3 {
        background: color-mix(in srgb, var(--accent) 76%, var(--surface));
      }

      .trail-legend i.is-4 {
        background: var(--accent);
      }

      /* Words */
      .tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .search {
        flex: 1 1 220px;
        min-height: 44px;
        padding-inline: 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--surface);
      }

      .pills,
      .switcher {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .pill {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        border: 0;
        border-radius: 16px;
        background: none;
        color: var(--ink-muted);
        font-size: 13px;
        font-weight: 500;
        line-height: 20px;
        cursor: pointer;
      }

      .pill::after {
        content: '';
        position: absolute;
        inset: -6px 0;
      }

      .pill:hover {
        background: var(--chip);
      }

      .pill[aria-pressed='true'] {
        background: var(--ink);
        color: var(--surface);
      }

      .words {
        padding: 8px 24px;
      }

      .word-group-title {
        padding: 18px 0 2px;
        color: var(--ink-muted);
        font-size: 12px;
        font-weight: 600;
        line-height: 18px;
      }

      .word-row + .word-row {
        border-top: 1px solid var(--line);
      }

      .word-summary {
        display: grid;
        grid-template-columns:
          minmax(0, 1.1fr) minmax(0, 1.6fr)
          100px 88px 20px;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 60px;
        padding: 8px 0;
        border: 0;
        background: none;
        text-align: left;
        cursor: pointer;
      }

      .word-summary:hover .row-word {
        color: var(--accent);
      }

      .word-from,
      .word-next {
        overflow: hidden;
        color: var(--ink-muted);
        font-size: 13px;
        line-height: 20px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .word-summary .icon {
        width: 16px;
        height: 16px;
        color: var(--ink-muted);
        transition: transform 120ms ease-out;
      }

      .word-summary[aria-expanded='true'] .icon {
        transform: rotate(180deg);
      }

      .word-detail {
        padding: 0 0 18px;
      }

      .detail-top {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .sentence {
        margin-bottom: 10px;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--chip);
      }

      .sentence-text {
        font-size: 15px;
        line-height: 23px;
      }

      .sentence-line {
        color: var(--ink-muted);
        font-size: 14px;
        line-height: 21px;
      }

      .sentence-line + .sentence-text,
      .sentence-text + .sentence-line {
        margin-top: 6px;
      }

      .sentence-text .icon-button {
        margin-block: -10px;
        vertical-align: middle;
      }

      .sentence-translation {
        margin-top: 4px;
        color: var(--ink-muted);
        font-size: 14px;
        line-height: 21px;
      }

      .sentence-tools,
      .detail-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 2px 18px;
        margin-top: 8px;
      }

      .detail-actions {
        justify-content: flex-end;
        gap: 8px;
      }

      mark {
        background: none;
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline 2px;
        text-underline-offset: 4px;
      }

      /* Dictionary */
      .dict-anchor {
        position: relative;
      }

      .dict {
        position: absolute;
        z-index: 5;
        top: 100%;
        right: 7px;
        width: max-content;
        min-width: 200px;
        max-width: min(340px, 78vw);
        padding: 14px 18px 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--pop-shadow);
        text-align: left;
      }

      .dict-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        column-gap: 8px;
        min-height: 28px;
      }

      .dict-head .icon-button {
        margin-block: -8px;
        margin-left: auto;
        margin-right: -10px;
      }

      .dict-word {
        font-size: 20px;
        font-weight: 650;
        line-height: 28px;
      }

      .dict-sense {
        margin-top: 10px;
      }

      .dict-sense + .dict-sense {
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 4px;
      }

      .chip {
        padding: 1px 8px;
        border-radius: 7px;
        background: var(--chip);
        font-size: 15px;
        font-weight: 500;
        line-height: 24px;
      }

      /* Review */
      .review {
        display: flex;
        flex-direction: column;
        max-width: 720px;
        min-height: calc(100dvh - 80px);
      }

      .review-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .review-status {
        flex: 1;
        color: var(--ink-muted);
        font-size: 13px;
        line-height: 20px;
        text-align: right;
      }

      .review-bar {
        height: 4px;
        margin-bottom: 16px;
        overflow: hidden;
        border-radius: 2px;
        background: var(--line);
      }

      .review-bar span {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 160ms ease-out;
      }

      .review-card {
        padding: 12px 28px 8px;
      }

      .review-source {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 44px;
        margin-bottom: 6px;
      }

      .review-title {
        overflow: hidden;
        flex: 1;
        min-width: 0;
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .review-source .dict-anchor {
        margin-right: -10px;
      }

      .review-source .dict {
        right: 7px;
      }

      .review-word-row {
        display: flex;
        align-items: center;
        gap: 2px;
      }

      .review-word {
        font-size: 36px;
        font-weight: 650;
        letter-spacing: -0.015em;
        line-height: 44px;
        overflow-wrap: anywhere;
      }

      .cues {
        margin-top: 20px;
      }

      .cue {
        margin-top: 8px;
        color: var(--ink-muted);
        font-size: 15px;
        line-height: 22px;
      }

      .cue.is-current {
        color: var(--ink);
        font-size: 20px;
        font-weight: 500;
        line-height: 30px;
      }

      .cue .icon-button {
        margin-block: -8px;
        vertical-align: middle;
      }

      .review-tools {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px 16px;
        margin-top: 18px;

      .disclosure .icon {
        transition: transform 120ms ease-out;
      }

        transform: rotate(90deg);

      .disclosure {
        color: var(--ink);
        font-size: 14px;
      }

      .review-translation {
        margin-top: 10px;
        color: var(--ink-muted);
        font-size: 15px;
        line-height: 24px;
      }

        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
        align-items: center;
        margin-top: 16px;
        padding-block: 12px;
        border-top: 1px solid var(--line);
      }

      .grades {
        position: sticky;
        bottom: 16px;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: auto;
        padding-top: 16px;
      }

      .grade {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 64px;
        justify-content: center;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: var(--shadow);
        cursor: pointer;

      .grade:hover {
        border-color: var(--line-strong);
        background: var(--chip);
      }

      .grade b {
        font-size: 15px;
        font-weight: 600;
        line-height: 22px;
      }

      .grade small {
        color: var(--ink-muted);
        font-size: 12px;
        line-height: 16px;
      }

      kbd {
        position: absolute;
        top: 6px;
        right: 10px;
        color: var(--ink-muted);
        font: inherit;
        font-size: 11px;
        line-height: 14px;
      }

      /* Settings and prompt */
      .setting {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 64px;
      }

      .setting + .setting {
        border-top: 1px solid var(--line);
      }

      .proto-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 4px 16px;
        padding: 6px 16px;
        border-bottom: 1px dashed var(--line-strong);
        color: var(--ink-muted);
        font-size: 11px;
      }

      .video-title {
        display: flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }

      .video-title svg {
        flex: none;
        width: 14px;
        height: 14px;
      }

      .video-title-text {
        overflow: hidden;
        min-width: 0;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .proto-note {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .proto-note select {
        color: inherit;
        font: inherit;
      }

      /* Style variants under comparison */
      [data-style='paper'] {
        --ground: #ddd5c2;
        --surface: #fbf8f0;
        --ink: #29251d;
        --ink-muted: #6a6354;

        --line-strong: #857c6a;

      [data-style='paper'] .sentence,
      [data-style='paper'] .rail-item,

      [data-style='stamp'] .rail-item,

      }

      [data-style='stamp'] .card,
      [data-style='stamp'] .grade,
      [data-style='stamp'] .dict,
      [data-style='stamp'] .search,
      [data-style='stamp'] .button,
      [data-style='stamp'] .action {

      }

      [data-style='stamp'] .search {
        border-color: var(--line);
      }

      [data-style='stamp'] .button,

      }

      [data-style='stamp'] .action.is-danger {

      [data-style='stamp'] h2,
      [data-style='stamp'] .muted,
      [data-style='stamp'] .word-group-title,
      [data-style='stamp'] .grade small,
      [data-style='stamp'] .level,

      [data-style='stamp'] .level-dots span:not(.is-on) {

      [data-style='stamp'] .sentence {

      }

      [data-style='stamp'] .word-row + .word-row,
      [data-style='stamp'] .setting + .setting {
        border-top-width: 1.5px;
      }

      [data-style='stamp'] .trail span,
      [data-style='stamp'] .trail-legend i,
      [data-style='stamp'] .forecast-plot span,
      [data-style='stamp'] .ladder-track,
      [data-style='stamp'] .ladder-track span,
      [data-style='stamp'] .stage-bar {

      @media (max-width: 720px) {
        .app {
          display: block;

        .rail {
          position: fixed;
          z-index: 8;

        }

          flex-direction: row;

        }

        .rail-item {

        }

        .rail-badge {
          right: 6px;
        }

        main {
          padding: 16px;
        }

        .span-2,
        .span-3 {
          grid-column: span 6;
        }

        .grid.stats .span-2 {
          grid-column: span 2;
        }

        .grid.stats .card {
          padding: 14px;
        }

        .stat-value {
          font-size: 22px;
          line-height: 28px;
        }

        .hero {
          padding: 24px;
        }

        .words {
          padding: 4px 16px;
        }

        .word-summary {
          grid-template-columns: minmax(0, 1fr) auto 16px;
        }

        .word-from,
        .word-next {

        }

        .review-card {
          padding-inline: 16px;
        }

        .review-word {

          line-height: 36px;
        }

        .review {
          min-height: calc(100dvh - 108px);
        }

        .grades {
          bottom: 72px;
        }

        .proto-bar {
          display: none;
        }
      }
    </style>

  <body>
    <div class="proto-bar" aria-label="Prototype controls">
      <label class="proto-note is-style"
        >Prototype style
        <select id="style">
          <option value="paper">Paper: matte and grainy</option>
          <option value="stamp">Stamp: hard edges and ink</option>
          <option value="soft">Soft: current</option>
        </select>
      </label>
      <label class="proto-note"
        >Prototype accent
        <select id="accent">
          <option value="vermilion">Vermilion</option>
          <option value="indigo">Indigo</option>
        </select>
      </label>
    </div>
    <div class="app">
      <nav class="rail" aria-label="Main" id="rail"></nav>
      <main id="main"></main>
    </div>

    <script>
      const ICON = {
        home: 'M5 12h-2l9-9l9 9h-2 M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7 M9 21v-6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v6',
        review:
          'M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2z M8 21h8',
        words: 'M5 6h14 M5 12h14 M5 18h9',
        progress: 'M4 20h16 M7 20v-6 M12 20v-11 M17 20v-15',
        settings: 'M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4',
        sun: 'M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0 M12 3v2 M12 19v2 M3 12h2 M19 12h2 M5.6 5.6l1.4 1.4 M17 17l1.4 1.4 M5.6 18.4l1.4-1.4 M17 7l1.4-1.4',
        moon: 'M12 3a9 9 0 1 0 9 9a7 7 0 0 1-9-9',
        youtube:
          'M2 8a4 4 0 0 1 4-4h12a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-12a4 4 0 0 1-4-4z M10 9l5 3l-5 3z',
        speak:
          'M15 8a5 5 0 0 1 0 8 M17.7 5a9 9 0 0 1 0 14 M6 15h-2a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1h2l3.5-4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1-1.5 .5l-3.5-4.5',
        book: 'M10 19h-6a1 1 0 0 1-1-1v-14a1 1 0 0 1 1-1h6a2 2 0 0 1 2 2a2 2 0 0 1 2-2h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6a2 2 0 0 0-2 2a2 2 0 0 0-2-2 M12 5v16 M7 7h1 M7 11h1 M16 7h1 M16 11h1 M16 15h1',
        down: 'M6 9l6 6l6-6',
        up: 'M6 15l6-6l6 6',
        right: 'M9 6l6 6l-6 6',
        play: 'M8 5v14l11-7z',
        check: 'M5 12l5 5l9-10',
        trash: 'M4 7h16 M10 11v6 M14 11v6 M6 7l1 13h10l1-13 M9 7v-3h6v3',
        download: 'M12 4v11 M7 11l5 5l5-5 M5 20h14',
      };
      const videoTitle = (title) =>
        `<span class="video-title" title="${title}">${icon('youtube')}<span class="video-title-text">${title}</span></span>`;
      const icon = (name) =>
        `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[name]}"/></svg>`;

      const LADDER = [
        '10 min',
        '1 day',
        '3 days',
        '7 days',
        '14 days',
        '30 days',
        '60 days',
      ];
      const STAGE = { new: 'New', learning: 'Learning', known: 'Known' };

      const sentence = (
        before,
        form,
        after,
        translation,
        video,
        time,
        prev,
        next,
      ) => ({
        before,
        form,
        after,
        translation,
        video,
        time,
        prev,
        next,
      });
      const SKY =
        'How Scientists Learned to Watch the Night Sky Without Telescopes';
      const RIVER = 'A Slow Day Along the River';
      const CITY = 'Starting Over in a New City';
      const WORDS = [
        {
          lemma: 'bank',
          phonetic: '/bæŋk/',
          level: 1,
          reviews: 3,
          due: 'Now',
          isDue: true,
          group: 'Today',
          senses: [
            ['銀行', 'She works at a bank downtown.', '她在市中心的銀行工作。'],
            ['河岸', 'Trees grow along the bank.', '岸邊長滿了樹。'],
          ],
          sentences: [
            sentence(
              'then sat on the ',
              'bank',
              ' and watched the boats go by.',
              '然後坐在河岸邊看船經過。',
              RIVER,
              '3:24',
              'We walked for an hour,',
              'It was the quietest afternoon.',
            ),
          ],
        },
        {
          lemma: 'observe',
          phonetic: '/əbˈzɜːrv/',
          level: 2,
          reviews: 4,
          due: 'Now',
          isDue: true,
          group: 'Today',
          senses: [
            [
              '觀察',
              'We observed the birds for an hour.',
              '我們觀察了那些鳥一個小時。',
            ],
          ],
          sentences: [
            sentence(
              'They kept ',
              'observing',
              ' the same stars, night after night,',
              '他們夜復一夜地觀察同樣的星星，',
              SKY,
              '12:08',
              'For thousands of years, people relied on their eyes.',
              'and slowly the patterns appeared.',
            ),
          ],
        },
        {
          lemma: 'reluctant',
          phonetic: null,
          level: 0,
          reviews: 0,
          due: 'Now',
          isDue: true,
          group: 'Today',
          senses: [
            ['不情願的', 'She was reluctant to leave.', '她不太想離開。'],
          ],
          sentences: [
            sentence(
              'He was ',
              'reluctant',
              ' to tell anyone what had happened.',
              '他不太願意告訴任何人發生了什麼事。',
              CITY,
              '1:12',
              null,
              null,
            ),
          ],
        },
        {
          lemma: 'responsibility',
          phonetic: '/rɪˌspɑːnsəˈbɪləti/',
          level: 1,
          reviews: 2,
          due: 'In 4 hours',
          group: 'Yesterday',
          senses: [
            [
              '責任',
              'It is your responsibility to lock the door.',
              '鎖門是你的責任。',
            ],
          ],
          sentences: [
            sentence(
              'Suddenly I had all these new ',
              'responsibilities',
              ' at work,',
              '工作上突然多了這些新責任，',
              CITY,
              '0:47',
              'Moving here meant learning everything.',
              'and nobody to ask.',
            ),
          ],
        },
        {
          lemma: 'telescope',
          phonetic: '/ˈtelɪskoʊp/',
          level: 3,
          reviews: 5,
          due: 'In 2 days',
          group: 'Yesterday',
          senses: [
            ['望遠鏡', 'He bought a small telescope.', '他買了一台小望遠鏡。'],
          ],
          sentences: [
            sentence(
              'Then came the ',
              'telescope',
              ', and everything changed.',
              '接著望遠鏡出現了，一切都變了。',
              SKY,
              '14:30',
              null,
              null,
            ),
            sentence(
              'A ',
              'telescope',
              ' does not make the sky any closer.',
              '望遠鏡並不會讓天空變近。',
              SKY,
              '18:02',
              null,
              null,
            ),
          ],
        },
        {
          lemma: 'quiet',
          phonetic: '/ˈkwaɪət/',
          level: 5,
          reviews: 6,
          due: 'In 5 days',
          group: 'Earlier',
          senses: [['安靜的', 'The room was quiet.', '房間很安靜。']],
          sentences: [
            sentence(
              'It was the ',
              'quiet',
              'est afternoon of the trip.',
              '那是旅程中最安靜的下午。',
              RIVER,
              '3:30',
              null,
              null,
            ),
          ],
        },
        {
          lemma: 'river',
          phonetic: '/ˈrɪvər/',
          level: 6,
          reviews: 7,
          due: 'Finished',
          retired: true,
          group: 'Earlier',
          senses: [['河流', 'The river is wide.', '這條河很寬。']],
          sentences: [
            sentence(
              'Down by the ',
              'river',
              ', the air felt different.',
              '在河邊，空氣感覺不一樣。',
              RIVER,
              '2:58',
              null,
              null,
            ),
          ],
        },
        {
          lemma: 'sky',
          phonetic: '/skaɪ/',
          level: 2,
          reviews: 3,
          due: 'Not reviewing',
          retired: true,
          group: 'Earlier',
          senses: [['天空', 'The sky is clear.', '天空很晴朗。']],
          sentences: [
            sentence(
              'The night ',
              'sky',
              ' was full of stars.',
              '夜空滿是星星。',
              SKY,
              '0:31',
              null,
              null,
            ),
          ],
        },
      ];
      const NEARBY = {
        telescope: [
          'For centuries, people could only guess.',
          'Nobody looked back after that.',
        ],
        quiet: [
          'We sat on the grass for a while.',
          'Even the birds had gone home.',
        ],
        river: [
          'We left the road after lunch.',
          'You could smell the rain coming.',
        ],
        sky: [
          'We drove out past the last town.',
          'Nobody said anything for a while.',
        ],
      };
      for (const word of WORDS) {
        for (const item of word.sentences) {
          const [prev, next] = NEARBY[word.lemma] ?? [];
          item.prev ??= prev ?? null;
          item.next ??= next ?? null;
        }
      }
      const HARD = [
        ['bank', 3],
        ['observe', 2],
      ];
      const stageOf = (word) =>
        word.retired || word.level >= 5
          ? 'known'
          : word.reviews === 0
            ? 'new'
            : 'learning';
      const counts = () => {
        const result = { new: 0, learning: 0, known: 0 };
        for (const word of WORDS) result[stageOf(word)] += 1;
        return result;
      };

      const state = {
        filter: 'all',
        view: 'time',
        query: '',
        open: null,
        dict: null,
        translated: new Set(),
        expanded: new Set(),
        queue: WORDS.filter((word) => word.isDue),
        index: 0,
        reveal: false,
        collapsed: false,
        status: '',
        done: [],
      };

      const $main = document.getElementById('main');
      const route = () => location.hash.replace(/^#\/?/, '') || 'home';
      const stageLabel = (word) => {
        const stage = stageOf(word);
        return `<span class="stage"><span class="stage-dot is-${stage}"></span>${STAGE[stage]}</span>`;
      };
      const levelTrack = (word) => {
        const reached = word.reviews === 0 ? 0 : word.level + 1;
        const label = word.retired
          ? 'Not scheduled'
          : word.reviews === 0
            ? 'New word'
            : `${LADDER[word.level].replace(' days', '-day').replace(' day', '-day').replace(' min', '-min')} interval`;
        const dots = LADDER.map(
          (_, at) => `<span class="${at < reached ? 'is-on' : ''}"></span>`,
        ).join('');
        return `<span class="level" role="img" aria-label="Level ${reached} of 7. ${label}" title="${LADDER.join(' → ')}"><span class="level-dots">${dots}</span>${label}</span>`;
      };
      const dictionary = (word, withSpeak) => `
        <aside class="dict" aria-label="Dictionary">
          <div class="dict-head">
            <span class="dict-word">${word.lemma}</span>
            ${word.phonetic ? `<span class="muted">${word.phonetic}</span>` : ''}
            ${withSpeak ? `<button class="icon-button" data-speak="${word.lemma}" aria-label="Play pronunciation">${icon('speak')}</button>` : ''}
          </div>
          ${word.senses
            .map(
              ([meaning, example, translation]) => `
            <div class="dict-sense">
              <div class="chips"><span class="chip">${meaning}</span></div>
              <div style="font-size:14px;font-weight:500;line-height:21px">${example}</div>
              <div class="muted">${translation}</div>
            </div>`,
            )
            .join('')}
        </aside>`;
      const dictButton = (word, withSpeak = false) => `
        <span class="dict-anchor">
          <button class="icon-button" data-dict="${word.lemma}" aria-label="Open dictionary" title="Dictionary" aria-expanded="${state.dict === word.lemma}">${icon('book')}</button>
          ${state.dict === word.lemma ? dictionary(word, withSpeak) : ''}
        </span>`;

      function home() {
        const due = state.queue.length - state.index;
        const recent = WORDS.slice(0, 4);
        const c = counts();
        return `<div class="page">
          <div class="grid">
            <section class="card hero span-6">
              <div>
                <p class="muted">Ready for review</p>
                <div class="hero-count">${Math.max(due, 0)} ${due === 1 ? 'word' : 'words'}</div>
                <p class="muted">1 more later today</p>
              </div>
              <a class="button is-primary" href="#/review">Start review ${icon('right')}</a>
            </section>
          </div>
          <div class="grid stats" style="margin-top:16px">
            <div class="card span-2"><div class="muted">Review streak</div><div class="stat-value">8 days</div></div>
            <div class="card span-2"><div class="muted">Known words</div><div class="stat-value">${c.known}<span class="muted"> of ${WORDS.length} saved</span></div></div>
            <div class="card span-2"><div class="muted">Reviews, last 7 days</div><div class="stat-value">24</div></div>
          </div>
          <div class="grid" style="margin-top:16px">
            <section class="card span-6">
              <div class="card-head list-head"><h2>Recently saved</h2><a class="text-button" href="#/words">All words</a></div>
              <ul class="list list-rows">${recent
                .map(
                  (word) => `
                <li><a class="row-link" href="#/words" data-open="${word.lemma}"><span class="row-word">${word.lemma}</span>${stageLabel(word)}</a></li>`,
                )
                .join('')}
              </ul>
            </section>
          </div>
        </div>`;
      }

      function progress() {
        const c = counts();
        const total = WORDS.length;
        const levels = LADDER.map((label, level) => ({
          label,
          count: WORDS.filter(
            (word) => !word.retired && word.reviews > 0 && word.level === level,
          ).length,
          stage: level >= 5 ? 'known' : 'learning',
        }));
        const peak = Math.max(...levels.map((item) => item.count), c.new, 1);
        const forecast = [
          ['Today', 4],
          ['Tue', 0],
          ['Wed', 1],
          ['Thu', 0],
          ['Fri', 2],
          ['Sat', 0],
          ['Sun', 1],
        ];
        const fPeak = Math.max(...forecast.map(([, count]) => count));
        const trail = Array.from({ length: 84 }, (_, at) => {
          if (at > 80) return '<span class="is-future"></span>';
          const value = (at * 7 + (at % 5) * 11) % 13;
          const shade = value < 4 ? 0 : Math.ceil((value - 3) / 2.5);
          return `<span class="is-${shade}" title="${value < 4 ? 0 : value} reviews"></span>`;
        }).join('');
        return `<div class="page">
          <div class="page-head"><h1>Progress</h1></div>
          <div class="grid">
            <section class="card span-6">
              <div class="muted">Words you know</div>
              <div class="big-number">${c.known}<span class="muted" style="font-size:18px;font-weight:500"> of ${total}</span></div>
              <div class="stage-bar" aria-hidden="true">
                ${['new', 'learning', 'known'].map((stage) => `<span class="is-${stage}" style="flex:${c[stage]}"></span>`).join('')}
              </div>
              <div class="stage-links">
                ${['new', 'learning', 'known'].map((stage) => `<a class="text-button" href="#/words" data-filter="${stage}"><span class="stage"><span class="stage-dot is-${stage}"></span>${STAGE[stage]} · ${c[stage]}</span></a>`).join('')}
              </div>
            </section>
            <section class="card span-3">
              <div class="card-head"><h2>Review intervals</h2></div>
              <div class="ladder">
                <span>New</span><span class="ladder-track"><span class="is-new" style="width:${(c.new / peak) * 100}%"></span></span><span class="ladder-count">${c.new}</span>
                ${levels.map(({ label, count, stage }) => `<span>${label}</span><span class="ladder-track"><span class="is-${stage}" style="width:${(count / peak) * 100}%"></span></span><span class="ladder-count">${count}</span>`).join('')}
              </div>
              <p class="muted" style="margin-top:12px">How long each word waits between reviews. See Next 7 days for actual dates.</p>
            </section>
            <section class="card span-3">
              <div class="card-head"><h2>Next 7 days</h2></div>
              <div class="forecast">
                ${forecast
                  .map(
                    (
                      [name, count],
                      at,
                    ) => `<div class="forecast-day ${at === 0 ? 'is-today' : ''}" title="${name}: ${count} words">
                  <div class="forecast-plot">${count ? `<span style="height:${(count / fPeak) * 76}%"><b>${count}</b></span>` : ''}</div>
                  <span class="forecast-name">${name}</span>
                </div>`,
                  )
                  .join('')}
              </div>
            </section>
            <section class="card span-3">
              <div class="card-head"><h2>Review activity</h2><span class="muted">8-day streak · 136 reviews</span></div>
              <div class="trail" aria-label="Reviews per day over 12 weeks" role="img">${trail}</div>
              <div class="trail-legend" aria-hidden="true">Less <i></i><i class="is-1"></i><i class="is-2"></i><i class="is-3"></i><i class="is-4"></i> More</div>
            </section>
            <section class="card span-3">
              <div class="card-head list-head"><div><h2>Hard words</h2><p class="muted">Forgotten most in the last 30 days</p></div></div>
              <ul class="list list-rows">${HARD.map(([word, times]) => `<li><a class="row-link" href="#/words" data-open="${word}"><span class="row-word">${word}</span><span class="forget-count">Forgot ${times}×</span></a></li>`).join('')}</ul>
            </section>
          </div>
        </div>`;
      }

      const sentenceBlock = (word, item, at) => {
        const key = `${word.lemma}-${at}`;
        const shown = state.translated.has(key);
        const expanded = state.expanded.has(key);
        const hasContext = item.prev || item.next;
        return `<div class="sentence">
          ${expanded && item.prev ? `<div class="sentence-line">${item.prev}</div>` : ''}
          <div class="sentence-text">${item.before}<mark>${item.form}</mark>${item.after}${hasContext ? `<button class="icon-button" data-expand="${key}" aria-label="${expanded ? 'Hide nearby lines' : 'Show nearby lines'}" title="${expanded ? 'Hide nearby lines' : 'Show nearby lines'}" aria-expanded="${expanded}">${icon(expanded ? 'up' : 'down')}</button>` : ''}</div>
          ${expanded && item.next ? `<div class="sentence-line">${item.next}</div>` : ''}
          ${shown ? `<div class="sentence-translation">${item.translation}</div>` : ''}
          <div class="sentence-tools">
            <button class="text-button" data-translate="${key}">${shown ? 'Hide translation' : 'Show translation'}</button>
            <a class="text-button" href="#/words" data-note="Would open the video at ${item.time}">${icon('play')} ${item.time}</a>
            <span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1 1 120px">${videoTitle(item.video)}</span>
          </div>
        </div>`;
      };

      function wordRow(word) {
        const open = state.open === word.lemma;
        return `<li class="word-row">
          <button class="word-summary" data-toggle="${word.lemma}" aria-expanded="${open}">
            <span class="row-word">${word.lemma}</span>
            <span class="word-from">${videoTitle(word.sentences[0].video)}</span>
            ${stageLabel(word)}
            <span class="word-next">${word.due}</span>
            ${icon('down')}
          </button>
          ${
            open
              ? `<div class="word-detail">
            <div class="detail-top">${levelTrack(word)}${dictButton(word, true)}</div>
            ${word.sentences.map((item, at) => sentenceBlock(word, item, at)).join('')}
            <div class="detail-actions">
              <button class="action" data-note="${word.retired ? 'Would return this word to review' : "Would say: this word won't come up for review again. It stays in Words as Known. With Undo."}">${icon('check')} ${word.retired ? 'Review again' : 'Stop reviewing'}</button>
              <button class="action is-danger" data-note="Would ask, then delete this word">${icon('trash')} Delete</button>
            </div>
          </div>`
              : ''
          }
        </li>`;
      }

      function words() {
        const c = counts();
        const query = state.query.trim().toLowerCase();
        const shown = WORDS.filter(
          (word) => state.filter === 'all' || stageOf(word) === state.filter,
        ).filter(
          (word) =>
            !query ||
            word.lemma.includes(query) ||
            word.sentences.some((item) =>
              item.video.toLowerCase().includes(query),
            ),
        );
        const groups = new Map();
        for (const word of shown) {
          const name =
            state.view === 'time' ? word.group : word.sentences[0].video;
          groups.set(name, [...(groups.get(name) ?? []), word]);
        }
        const filters = [
          ['all', 'All', WORDS.length],
          ['new', 'New', c.new],
          ['learning', 'Learning', c.learning],
          ['known', 'Known', c.known],
        ];
        return `<div class="page">
          <div class="page-head">
            <h1>Words</h1>
            <button class="button" data-note="Would download a CSV of the words shown">${icon('download')} Export</button>
          </div>
          <div class="tools">
            <label class="visually-hidden" for="search">Search words</label>
            <input class="search" id="search" type="search" placeholder="Search words or videos" value="${state.query}" />
            <div class="switcher" role="group" aria-label="Group by">
              <button class="pill" data-view="time" aria-pressed="${state.view === 'time'}">By date</button>
              <button class="pill" data-view="video" aria-pressed="${state.view === 'video'}">By video</button>
            </div>
          </div>
          <div class="pills" role="group" aria-label="Filter by stage" style="margin-bottom:16px">
            ${filters.map(([id, label, count]) => `<button class="pill" data-stage="${id}" aria-pressed="${state.filter === id}">${label} ${count}</button>`).join('')}
          </div>
          <section class="card words">
            ${
              shown.length === 0
                ? '<p class="muted" style="padding:20px 0">No words match.</p>'
                : [...groups]
                    .map(
                      ([name, group]) => `
              <div class="word-group-title">${state.view === 'time' ? name : videoTitle(name)}</div>
              <ul class="list">${group.map(wordRow).join('')}</ul>`,
                    )
                    .join('')
            }
          </section>
        </div>`;
      }

      function review() {
        const word = state.queue[state.index];
        const total = state.queue.length;
        const head = `<div class="review-head">
            <a class="text-button" href="#/home">End review</a>
            <span class="review-status" role="status">${state.status}</span>
            ${state.done.length ? '<button class="text-button" data-undo>Undo</button>' : ''}
            <span class="muted" style="font-variant-numeric:tabular-nums">${Math.min(state.index + 1, total)} / ${total}</span>
          </div>
          <div class="review-bar"><span style="width:${(state.index / total) * 100}%"></span></div>`;
        if (!word) {
          return `<div class="page review">${head}
            <section class="card" style="padding:40px;text-align:center">
              <h1>All done for now</h1>
              <p class="muted" style="margin:6px 0 20px">You reviewed ${state.done.length} words. The next one returns in 10 minutes.</p>
              <a class="button is-primary" href="#/home">Back to Home</a>
            </section></div>`;
        }
        const item = word.sentences[0];
        const cue = (text, cls = '') => `<p class="cue ${cls}">${text}</p>`;
        const hasContext = item.prev || item.next;
        const next = (grade) => {
          if (grade === 'again') return '10 min';
          if (grade === 'hard') return LADDER[Math.max(word.level - 1, 1)];
          return word.level >= 6 ? 'Done' : LADDER[Math.max(word.level + 1, 2)];
        };
        const grades = [
          ['again', 'Forgot'],
          ['hard', 'Unsure'],
          ['good', 'Got it'],
        ];
        return `<div class="page review">${head}
          <article class="card review-card" id="card" tabindex="-1">
            <div class="review-source">
              <a class="text-button" href="#/review" data-note="Would open the video at ${item.time}">${icon('play')} Back to video ${item.time}</a>
              <span class="review-title">${videoTitle(item.video)}</span>
              ${dictButton(word)}
            </div>
            <div class="review-word-row">
              <h1 class="review-word">${item.form}</h1>
              <button class="icon-button" data-speak="${item.form}" aria-label="Play pronunciation">${icon('speak')}</button>
            </div>
            ${levelTrack(word)}
            <div class="cues">
              ${item.prev && !state.collapsed ? cue(item.prev) : ''}
              <p class="cue is-current">${item.before}<mark>${item.form}</mark>${item.after}${hasContext ? `<button class="icon-button" data-collapse aria-label="${state.collapsed ? 'Show nearby lines' : 'Hide nearby lines'}" aria-expanded="${!state.collapsed}">${icon(state.collapsed ? 'down' : 'up')}</button>` : ''}</p>
              ${item.next && !state.collapsed ? cue(item.next) : ''}
            </div>
            <div class="review-tools">
              <button class="text-button disclosure" data-reveal aria-expanded="${state.reveal}">${icon('right')} ${state.reveal ? 'Hide translation' : 'Show translation'}</button>
            </div>
            ${state.reveal ? `<p class="review-translation">${item.translation}</p>` : ''}
            <div class="review-actions">
              <button class="action" data-note="Would say: this word won't come up for review again. It stays in Words as Known. With Undo.">${icon('check')} Stop reviewing</button>
              <button class="action is-danger" data-note="Would ask, then delete this word">${icon('trash')} Delete</button>
            </div>
          </article>
          <div class="grades">
            ${grades.map(([id, label], at) => `<button class="grade" data-grade="${id}"><kbd>${at + 1}</kbd><b>${label}</b><small>${next(id)}</small></button>`).join('')}
          </div>
        </div>`;
      }

      function settings() {
        const theme = document.documentElement.dataset.theme;
        return `<div class="page" style="max-width:640px">
          <div class="page-head"><h1>Settings</h1></div>
          <section class="card" style="padding-block:8px">
            <div class="setting"><span>Learning language</span><span class="muted">English</span></div>
            <div class="setting"><span>Native language</span><span class="muted">Traditional Chinese</span></div>
            <div class="setting"><span>Theme</span>
              <div class="switcher">
                ${[
                  ['light', 'Light'],
                  ['dark', 'Dark'],
                ]
                  .map(
                    ([id, label]) =>
                      `<button class="pill" data-theme-set="${id}" aria-pressed="${theme === id}">${label}</button>`,
                  )
                  .join('')}
              </div>
            </div>
            <div class="setting"><span>Save sound</span><span class="muted">On</span></div>
          </section>
        </div>`;
      }

      function rail() {
        const current = route();
        const due = Math.max(state.queue.length - state.index, 0);
        const theme = document.documentElement.dataset.theme;
        const item = (id, label, name, badge) =>
          `<a class="rail-item" href="#/${id}" ${current === id ? 'aria-current="page"' : ''}>${icon(name)}${label}${badge ? `<span class="rail-badge">${badge}</span>` : ''}</a>`;
        document.getElementById('rail').innerHTML = `
          ${item('home', 'Home', 'home')}
          ${item('review', 'Review', 'review', due)}
          ${item('words', 'Words', 'words')}
          ${item('progress', 'Progress', 'progress')}
          <div class="rail-end">
            <button class="rail-item" data-theme-toggle aria-label="Switch to ${theme === 'dark' ? 'light' : 'dark'} theme">${icon(theme === 'dark' ? 'sun' : 'moon')}Theme</button>
            ${item('settings', 'Settings', 'settings')}
          </div>`;
      }

      function render() {
        const pages = { home, review, words, progress, settings };
        $main.innerHTML = (pages[route()] ?? home)();
        rail();
      }

      function grade(id) {
        const word = state.queue[state.index];
        if (!word) return;
        state.done.push(id);
        state.status =
          id === 'again'
            ? `${word.lemma}: back in 10 min`
            : `${word.lemma}: saved`;
        state.index += 1;
        state.reveal = false;
        state.dict = null;
        render();
      }

      document.addEventListener('click', (event) => {
        if (
          event.target.closest('.dict') &&
          !event.target.closest('[data-speak]')
        )
          return;
        const target = event.target.closest('button, a');
        if (!target) {
          if (state.dict) {
            state.dict = null;
            render();
          }
          return;
        }
        const data = target.dataset;
        if (data.speak && 'speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(data.speak);
          utterance.lang = 'en';
          speechSynthesis.cancel();
          speechSynthesis.speak(utterance);
          return;
        }
        if (data.note) {
          event.preventDefault();
          state.status = data.note;
          alertNote(data.note);
          return;
        }
        if (data.dict) {
          state.dict = state.dict === data.dict ? null : data.dict;
          render();
          return;
        }
        if (state.dict) state.dict = null;
        if (data.toggle) {
          state.open = state.open === data.toggle ? null : data.toggle;
          state.dict = null;
          render();
          return;
        }
        if (data.open) {
          state.open = data.open;
          state.filter = 'all';
        }
        if (data.filter) {
          state.filter = data.filter;
          state.open = null;
        }
        if (data.stage) {
          state.filter = data.stage;
          render();
          return;
        }
        if (data.view) {
          state.view = data.view;
          render();
          return;
        }
        if (data.expand) {
          if (state.expanded.has(data.expand))
            state.expanded.delete(data.expand);
          else state.expanded.add(data.expand);
          render();
          return;
        }
        if (data.translate) {
          if (state.translated.has(data.translate))
            state.translated.delete(data.translate);
          else state.translated.add(data.translate);
          render();
          return;
        }
        if ('reveal' in data) {
          state.reveal = !state.reveal;
          render();
          return;
        }
        if ('collapse' in data) {
          state.collapsed = !state.collapsed;
          render();
          return;
        }
        if (data.grade) {
          grade(data.grade);
          return;
        }
        if ('undo' in data) {
          state.done.pop();
          state.index = Math.max(state.index - 1, 0);
          state.status = 'Undone';
          render();
          return;
        }
        if ('themeToggle' in data) {
          const root = document.documentElement;
          root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
          render();
          return;
        }
        if (data.themeSet) {
          document.documentElement.dataset.theme = data.themeSet;
          render();
        }
      });

      function alertNote(text) {
        const note = document.querySelector('.proto-note');
        const original = note.dataset.text ?? note.firstChild.textContent;
        note.dataset.text = original;
        note.firstChild.textContent = text + ' · ';
        clearTimeout(alertNote.timer);
        alertNote.timer = setTimeout(() => {
          note.firstChild.textContent = original;
        }, 2500);
      }

      document.addEventListener('input', (event) => {
        if (event.target.id !== 'search') return;
        state.query = event.target.value;
        const at = event.target.selectionStart;
        render();
        const input = document.getElementById('search');
        input.focus();
        input.setSelectionRange(at, at);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          if (state.dict) {
            state.dict = null;
            render();
          }
          return;
        }
        if (event.target.matches('input') || route() !== 'review') return;
        if (event.metaKey || event.ctrlKey || event.altKey) return;
        const map = { 1: 'again', 2: 'hard', 3: 'good' };
        if (map[event.key]) grade(map[event.key]);
        if (event.key === ' ' && !event.target.closest('button, a')) {
          event.preventDefault();
          state.reveal = !state.reveal;
          render();
        }
      });

      document.getElementById('style').addEventListener('change', (event) => {
        document.documentElement.dataset.style = event.target.value;
      });
      document.getElementById('accent').addEventListener('change', (event) => {
        document.documentElement.dataset.accent = event.target.value;
      });
      window.addEventListener('hashchange', () => {
        state.dict = null;
        render();
      });
      render();
    </script>
  </body>
</html>
