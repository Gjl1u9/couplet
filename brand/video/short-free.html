<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Couplet Short: Free</title>
    <style>
      /* The second upright film: free and light, from install to progress. */
      :root {
        --paper: #ddd5c2;
        --sheet: #fbf8f0;
        --ink: #29251d;
        --muted: #6a6354;
        --line: #857c6a;
        --accent: #c9401f;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
        --sans: -apple-system, 'Helvetica Neue', 'PingFang TC', sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--paper);
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--paper);
      }

      /* Titles sit above the picture, clear of the feed's own buttons at the bottom. */
      #band {
        position: absolute;
        z-index: 3;
        top: 0;
        right: 0;
        left: 0;
        height: 470px;
        background: var(--paper);
      }

      .title {
        position: absolute;
        right: 60px;
        bottom: 62px;
        left: 60px;
        margin: 0;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 88px;
        font-weight: 600;
        line-height: 102px;
        text-align: center;
        text-wrap: balance;
      }

      .title .word {
        display: inline-block;
        white-space: pre;
      }

      .title .key {
        position: relative;
      }

      .rule {
        position: absolute;
        right: 0;
        bottom: -6px;
        left: 0;
        height: 6px;
        background: var(--accent);
        transform-origin: left center;
      }

      #view {
        position: absolute;
        inset: 470px 0 0;
        overflow: hidden;
      }

      .camera {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: 0 0;
      }

      .window {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--sheet);
        box-shadow: 0 30px 80px rgba(41, 37, 29, 0.22);
      }

      #win-a {
        width: 1000px;
      }

      #win-b {
        width: 580px;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 52px;
        padding: 0 14px 0 16px;
        border-bottom: 1px solid #d9d1be;
      }

      .bar > i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d9d1be;
      }

      .address {
        flex: 1;
        min-width: 0;
        margin: 0 10px 0 12px;
        padding: 5px 16px;
        overflow: hidden;
        border-radius: 16px;
        background: #e6dfcc;
        color: var(--muted);
        font:
          14px/20px -apple-system,
          'Helvetica Neue',
          sans-serif;
        white-space: nowrap;
      }

      .tools {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .tools svg {
        display: block;
        width: 20px;
        height: 20px;
      }

      .tools .puzzle {
        color: var(--muted);
      }

      .tools .avatar {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #b9a98a;
      }

      #content {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #1a2226;
      }

      /* Our own landing page, where the film starts: the install takes one click. */
      #listing {
        position: absolute;
        z-index: 2;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--sheet);
        color: var(--ink);
        text-align: center;
      }

      #listing .mark {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: var(--sans);
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      #listing .mark svg {
        width: 52px;
        height: 52px;
      }

      #listing h2 {
        max-width: 820px;
        margin: 30px 0 0;
        font-family: var(--serif);
        font-size: 58px;
        font-weight: 600;
        line-height: 68px;
      }

      #listing h2 em {
        font-style: normal;
        text-decoration: underline 3px var(--accent);
        text-underline-offset: 8px;
      }

      #listing p {
        max-width: 760px;
        margin: 18px 0 0;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 25px;
        line-height: 34px;
      }

      #add {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 360px;
        height: 72px;
        margin-top: 30px;
        padding: 0 30px;
        border: 1px solid var(--accent);
        border-radius: 5px;
        background: var(--accent);
        color: #ffffff;
        font-family: var(--sans);
        font-size: 27px;
        font-weight: 600;
      }

      #add.is-added {
        border-color: var(--line);
        background: var(--sheet);
        color: var(--ink);
      }

      #add svg {
        width: 28px;
        height: 28px;
      }

      #toolbar-icon {
        transform-origin: center;
      }

      #player {
        position: absolute;
        inset: 0;
        isolation: isolate;
      }

      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #controls {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        padding: 36px 16px 6px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.66));
        color: #fff;
        font:
          14px/20px -apple-system,
          'Helvetica Neue',
          sans-serif;
      }

      #progress {
        height: 4px;
        background: rgba(255, 255, 255, 0.35);
      }

      #played {
        height: 100%;
        background: #ff7a59;
      }

      #row {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 38px;
      }

      #row svg {
        flex: none;
        width: 22px;
        height: 22px;
      }

      #gap {
        flex: 1;
      }

      #overlay {
        position: absolute;
        inset: 0;
      }

      #popup {
        position: absolute;
        z-index: 4;
        top: 48px;
        width: 300px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--sheet);
        box-shadow: 0 18px 46px rgba(41, 37, 29, 0.32);
        transform-origin: top right;
      }

      iframe {
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
      }

      #pages {
        position: relative;
        height: 680px;
        overflow: hidden;
      }

      #pages iframe {
        position: absolute;
        inset: 0;
        height: 100%;
      }

      .cursor {
        position: absolute;
        z-index: 6;
        top: 0;
        left: 0;
        width: 30px;
        height: 30px;
        transform-origin: 3px 3px;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.45));
      }

      .ring {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 3px solid #ff7a59;
        border-radius: 50%;
      }

      #end {
        position: absolute;
        z-index: 8;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-bottom: 240px;
        background: var(--paper);
        color: var(--ink);
      }

      #lockup {
        display: flex;
        align-items: center;
        gap: 28px;
      }

      #lockup svg {
        width: 124px;
        height: 124px;
      }

      #lockup span {
        font-family: var(--sans);
        font-size: 104px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
      }

      #tagline {
        margin: 64px 60px 0;
        font-family: var(--serif);
        font-size: 66px;
        font-weight: 600;
        line-height: 82px;
        text-align: center;
      }

      #tagline span {
        position: relative;
        display: inline-block;
      }

      #install {
        margin-top: 72px;
        padding: 26px 54px;
        border-radius: 10px;
        background: var(--accent);
        color: #ffffff;
        font-family: var(--sans);
        font-size: 42px;
        font-weight: 600;
        line-height: 50px;
      }

      #site {
        margin-top: 30px;
        color: var(--muted);
        font-family: var(--sans);
        font-size: 34px;
        line-height: 42px;
      }
    </style>
  </head>

    <script>
      const DURATION = 31.5;
      const SCALE = 1.6;
      // Where the picture centres: a little left, clear of the feed's buttons on the right.
      const CENTRE = 520;
      // The canvas columns kept clear of the feed's own buttons.
      const SAFE = { left: 60, right: 950 };

      // Every moment in one place, so the pacing can be changed without hunting.
      const AT = {
        addClick: 1.9,
        // The camera goes to the toolbar to see the icon arrive.
        toIcon: 2.2,
        iconPop: 3.0,
        // The landing page gives way to the video the person was already watching.
        toVideo: 4.3,
        cue1: 6.7,
        wordClick: 9.75,
        wordEntry: 10.15,
        wordStar: 11.4,
        wordClose: 12.4,
        cue2: 12.8,
        dragStart: 13.9,
        dragEnd: 14.5,
        phraseEntry: 14.95,
        phraseStar: 16.1,
        phraseClose: 17.1,
        toToolbar: 17.3,
        iconClick: 18.8,
        startClick: 20.0,
        toDashboard: 20.3,
        showTranslation: 22.0,
        gotIt: 23.4,
        toProgress: 23.8,
        toEnd: 27.6,
      };

      const TITLES = [
        {
          plain: 'Dual subtitles for YouTube.',
          key: 'Free, in one click.',
          newLine: true,
          start: 0.05,
          leave: 4.0,
        },
        {
          plain: 'On the videos',
          key: 'you already watch.',
          start: 4.3,
          leave: 8.4,
        },
        { plain: 'Click', key: 'any word.', start: 8.65, leave: 12.5 },
        { plain: 'Or a', key: 'whole phrase.', start: 12.75, leave: 17.1 },
        { plain: 'Review in', key: 'one click.', start: 17.35, leave: 20.15 },
        {
          plain: 'Review it',
          key: 'where you heard it.',
          start: 20.4,
          leave: 23.6,
        },
        { plain: 'See what', key: 'you know.', start: 23.85, leave: 27.4 },
      ];

      // Spans of the film during which the vlog is playing. Opening a word pauses it.
      const PLAYING = [
        [AT.toVideo - 0.3, AT.wordClick],
        [AT.wordClose + 0.1, AT.dragStart],
        [AT.phraseClose + 0.1, DURATION],
      ];

      // The vlog's lines, by when they start in the film. The same lines are saved in short-ui.tsx.
      const CUES = [
        {
          at: 0,
          original: 'Okay, we finally made it to the top.',
          translation: '好，我們終於爬到山頂了。',
        },
        {
          at: AT.cue1,
          original: 'The view up here is absolutely breathtaking.',
          translation: '這裡的風景真的美得令人屏息。',
        },
        {
          at: AT.cue2,
          original: "Let's grab a coffee and soak up the view.",
          translation: '我們去喝杯咖啡，好好享受這片景色。',
        },
        {
          at: AT.phraseClose + 1.4,
          original: 'The trams up here are older than my grandma.',
          translation: '這裡的電車比我奶奶還老。',
        },
      ];

      // Dashboard pages, each the real page in its own frame, and when each is on screen.
      const PAGES = [
        {
          scene: 'review',
          address: 'Couplet · Review',
          from: AT.toDashboard,
          to: AT.showTranslation,
        },
        {
          scene: 'review-translated',
          address: 'Couplet · Review',
          from: AT.showTranslation,
          to: AT.toProgress,
        },
        {
          scene: 'progress',
          address: 'Couplet · Progress',
          from: AT.toProgress,
          to: AT.toEnd + 1,
        },
      ];

      const clamp = (value) => Math.min(1, Math.max(0, value));
      const easeOut = (value) => 1 - (1 - value) ** 3;
      const easeInOut = (value) =>
        value < 0.5 ? 4 * value ** 3 : 1 - (-2 * value + 2) ** 3 / 2;
      const ramp = (t, start, end, ease = easeOut) =>
        ease(clamp((t - start) / (end - start)));
      const mix = (from, to, amount) => from + (to - from) * amount;
      const $ = (id) => document.getElementById(id);
      const parts = {};

      function buildTitle({ plain, key, newLine }) {
        const element = document.createElement('h1');
        element.className = 'title';
        const word = (text) => {
          const span = document.createElement('span');
          span.className = 'word';
          span.textContent = text;
          return span;
        };
        const plainWords = plain.split(' ');
        plainWords.forEach((text, at) => {
          const last = at === plainWords.length - 1;
          element.append(word(last && (!key || newLine) ? text : `${text} `));
        });
        if (key) {
          if (newLine) element.append(document.createElement('br'));
          const wrap = document.createElement('span');
          wrap.className = 'word key';
          const keyWords = key.split(' ');
          keyWords.forEach((text, at) => {
            wrap.append(word(at < keyWords.length - 1 ? `${text} ` : text));
          });
          const rule = document.createElement('i');
          rule.className = 'rule';
          wrap.append(rule);
          element.append(wrap);
        }
        $('band').append(element);
        return element;
      }

      function animateTitle(element, t, { start, leave }) {
        const all = [...element.querySelectorAll('.word')].filter(
          (word) => !word.classList.contains('key'),
        );
        all.forEach((word, at) => {
          const shown = ramp(t, start + at * 0.08, start + at * 0.08 + 0.3);
          word.style.opacity = shown;
          word.style.transform = `translateY(${mix(26, 0, shown)}px)`;
        });
        const rule = element.querySelector('.rule');
        if (rule) {
          const from = start + all.length * 0.08 + 0.1;
          rule.style.transform = `scaleX(${ramp(t, from, from + 0.4, easeInOut)})`;
        }
        const gone = ramp(t, leave, leave + 0.22);
        element.style.opacity = t < start ? 0 : 1 - gone;
        element.style.transform = `translateY(${mix(0, -18, gone)}px)`;
      }

      /** The town, the same every frame: a seeded scatter of houses up the hill. */
      function buildTown() {
        let seed = 7;
        const random = () => {
          seed = (seed * 16807) % 2147483647;
          return seed / 2147483647;
        };
        const walls = [
          '#efe3cf',
          '#e8c9a8',
          '#f3efe6',
          '#d9a77e',
          '#c9d6cf',
          '#f0d9c4',
          '#e4d3b0',
        ];
        const roofs = ['#b65a3a', '#c96f4a', '#a9533a', '#cf7d55'];
        const svg = (tag, attributes) => {
          const node = document.createElementNS(
            'http://www.w3.org/2000/svg',
            tag,
          );
          Object.entries(attributes).forEach(([name, value]) =>
            node.setAttribute(name, value),
          );
          return node;
        };
        const town = $('town');
        // Rows from the back of the hill to the front, each lower, larger, and further right.
        for (let row = 0; row < 7; row += 1) {
          const baseY = 150 + row * 26;
          const size = 18 + row * 4;
          let x = -40 + row * 14 + random() * 20;
          const end = 420 + row * 50;
          while (x < end) {
            const width = size * (0.9 + random() * 0.8);
            const height = size * (0.8 + random() * 0.6);
            const y = baseY + (x / 800) * 40 - height;
            town.append(
              svg('rect', {
                x,
                y,
                width,
                height,
                fill: walls[Math.floor(random() * walls.length)],
              }),
            );
            town.append(
              svg('path', {
                d: `M${x - 2} ${y}L${x + width / 2} ${y - height * 0.28}L${x + width + 2} ${y}z`,
                fill: roofs[Math.floor(random() * roofs.length)],
              }),
            );
            const windows = Math.max(1, Math.floor(width / 9));
            for (let w = 0; w < windows; w += 1) {
              if (random() < 0.35) continue;
              town.append(
                svg('rect', {
                  x: x + 3 + w * ((width - 6) / windows),
                  y: y + height * 0.35,
                  width: Math.max(2.5, size * 0.13),
                  height: Math.max(3.5, size * 0.2),
                  fill: '#4a4239',
                  opacity: 0.75,
                }),
              );
            }
            x += width + 1 + random() * 6;
          }
        }
        const bars = $('bars');
        for (let x = -50; x < 860; x += 34) {
          bars.append(svg('rect', { x, y: 404, width: 5, height: 60 }));
        }
      }

      const icon = (paths) =>
        `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths
          .map((d) => `<path d="${d}"></path>`)

      const ICON = {

        ],
        star: [
          'M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245',
        ],

      const sense = (meaning, example, translation) => `
        <div class="lookup-sense">
          <div class="lookup-meaning"><span class="meaning-chip">${meaning}</span></div>
          <div class="couplet-original">${example}</div>
          <div class="couplet-translation">${translation}</div>

      /** A cue as the overlay shows it: words are tokens, and punctuation is not. */
      const cueBox = ({ original, translation }) => {
        const box = document.createElement('div');
        box.className = 'box is-raised';
        const tokens = original
          .split(' ')
          .map((word) => {
            const [, text, tail] = word.match(/^(.*?)([.,!?]*)$/);
            return `<button class="token" type="button">${text}</button>${tail}`;
          })
          .join(' ');
        box.innerHTML = `
          <div class="strip">
            <div class="original" lang="en">${tokens}</div>
            <div class="translation" lang="zh-Hant">${translation}</div>
          </div>`;
        return box;
      };

      const stylesheet = (root, href) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        return new Promise((resolve, reject) => {
          link.onload = resolve;
          link.onerror = reject;
          root.append(link);
        });
      };

      const frame = (iframe, scene) =>
        new Promise((resolve, reject) => {
          iframe.onload = () => {
            iframe.contentWindow.ready.then(resolve, reject);
          };
          iframe.src = `short-ui.html?scene=${scene}`;
        });

      /** Where an element sits, in its window's own pixels. */
      function placeIn(win, element, offset = { x: 0, y: 0 }) {
        const box = element.getBoundingClientRect();
        const origin = win.getBoundingClientRect();
        return {
          x: box.left - origin.left + box.width / 2 + offset.x,
          y: box.top - origin.top + box.height / 2 + offset.y,
        };
      }

      /** The product's real styles and pages, so the film shows what ships. */
      async function mount() {
        buildTown();
        const overlay = $('overlay').attachShadow({ mode: 'open' });
        const loaded = ['tokens', 'lookup-panel', 'overlay'].map((name) =>

        parts.cues = CUES.map((cue) => {

        const panels = document.createElement('div');
        panels.className = 'panels';
        panels.innerHTML = `

            <div class="lookup-senses" lang="zh-Hant">

              <div class="loaded">

                ${sense('驚人的', 'She moved with breathtaking speed.', '她的速度快得驚人。')}
              </div>
            </div>

            <div class="lookup-head">
              <div class="lookup-title"><span class="lookup-phrase">soak up</span></div>
              <div class="lookup-actions">

        const extra = document.createElement('style');
        // The Large subtitle size, and :hover stands-ins, since a rendered frame has no pointer.
        extra.textContent = `

        const popupDocument = popupFrame.contentDocument;

        const winA = $('win-a');

        parts.phraseToken = coffeeTokens[6];
        parts.wordPanel = panels.querySelector('.word-panel');
        parts.phrasePanel = panels.querySelector('.phrase-panel');
        parts.width = content.width;
        const playerX = CENTRE - 500 * SCALE;
        parts.visible = {

        // Panels open above the strip, centred on the token, as the product places them.
        const place = (panel, token, box) => {
          box.style.display = 'flex';
          const tokenBox = token.getBoundingClientRect();

          panel.placedCenter =

        parts.word = placeIn(winA, parts.wordToken);
        setPanel(parts.wordPanel, true, 0);
        parts.wordStar = placeIn(winA, parts.wordPanel.querySelector('.save'));
        breath.style.display = 'none';
        place(parts.phrasePanel, parts.phraseToken, coffee);
        parts.rangeStart = placeIn(winA, parts.range[0]);
        parts.rangeEnd = placeIn(winA, parts.range[1]);
        setPanel(parts.phrasePanel, true, 0);
        parts.phraseStar = placeIn(
          winA,
          parts.phrasePanel.querySelector('.save'),
        );
        coffee.style.display = 'none';

        parts.icon = placeIn(winA, $('toolbar-icon'));
        $('popup').style.left = `${parts.icon.x + 22 - 300}px`;
        const startButton = popupDocument.querySelector('.popup-review button');
        // The start button's box is inside the frame, so add the frame's own place.
        parts.start = {
          x:
            popupFrame.getBoundingClientRect().left -
            winA.getBoundingClientRect().left +
            startButton.getBoundingClientRect().left +
            startButton.offsetWidth / 2,
          y:
            popupFrame.getBoundingClientRect().top -
            winA.getBoundingClientRect().top +
            startButton.getBoundingClientRect().top +

        const inPage = (scene, find) => {
          const page = PAGES.find((item) => item.scene === scene);
          const target = [

          const box = target.getBoundingClientRect();
          const origin = page.frame.getBoundingClientRect();
          const win = winB.getBoundingClientRect();
          return {
            x: origin.left - win.left + box.left + box.width / 2,
            y: origin.top - win.top + box.top + box.height / 2,

        parts.showTranslation = inPage('review', (node) =>
          node.textContent.includes('Show translation'),
        );
        parts.gotIt = inPage('review-translated', (node) =>
          node.textContent.includes('Got it'),
        );
        parts.progressScroll = Math.max(
          0,
          Math.min(
            320,
            PAGES.find((item) => item.scene === 'progress').frame
              .contentDocument.documentElement.scrollHeight - 680,
          ),
        );

        // Framing: the subtitles fill the width, then the toolbar's end, then the Dashboard.
        parts.frames = {
          player: { x: CENTRE - 500 * SCALE, y: 6 },
          wide: { x: CENTRE - 500 * 1.5, y: 30 },
          toolbar: { x: SAFE.right + 40 - 1000 * SCALE, y: 6 },
        };
        parts.cameraB = { x: 500 - (580 * SCALE) / 2, y: 6 };
        // The landing page, whole, with the toolbar where the icon arrives.
        parts.frames.listing = { x: 40, y: 330 };
        parts.add = placeIn(winA, $('add'));

        // The pointer's routes: each leg arrives at its place by `to`.
        parts.routeA = [
          { from: 0.7, to: 1.65, x: parts.add.x - 40, y: parts.add.y + 8 },
          { from: 8.8, to: 9.4, x: parts.word.x - 4, y: parts.word.y + 4 },
          {
            from: 10.6,
            to: 11.25,
            x: parts.wordStar.x,
            y: parts.wordStar.y + 2,
          },
          {
            from: 11.95,
            to: 12.6,
            x: parts.wordStar.x + 40,
            y: parts.word.y + 120,
          },
          {
            from: 13.0,
            to: 13.7,
            x: parts.rangeStart.x - 22,
            y: parts.rangeStart.y + 4,
          },
          {
            from: AT.dragStart + 0.05,
            to: AT.dragEnd - 0.05,
            x: parts.rangeEnd.x + 14,
            y: parts.rangeEnd.y + 4,
          },
          {
            from: 15.4,
            to: 15.95,
            x: parts.phraseStar.x,
            y: parts.phraseStar.y + 2,
          },
          { from: 17.3, to: 18.55, x: parts.icon.x, y: parts.icon.y + 2 },
          { from: 19.1, to: 19.8, x: parts.start.x, y: parts.start.y + 2 },
        ];
        parts.startA = { x: parts.add.x + 220, y: parts.add.y + 200 };
        parts.clicksA = [
          { at: AT.addClick, x: parts.add.x - 40, y: parts.add.y },
          { at: AT.wordClick, ...parts.word },
          { at: AT.wordStar, ...parts.wordStar },
          { at: AT.phraseStar, ...parts.phraseStar },
          { at: AT.iconClick, ...parts.icon },
          { at: AT.startClick, ...parts.start },
        ];
        parts.routeB = [
          {
            from: 21.1,
            to: 21.75,
            x: parts.showTranslation.x - 30,
            y: parts.showTranslation.y + 2,
          },
          { from: 22.5, to: 23.2, x: parts.gotIt.x, y: parts.gotIt.y + 2 },
        ];
        parts.startB = { x: 420, y: 560 };
        parts.clicksB = [
          {
            at: AT.showTranslation,
            ...parts.showTranslation,
            x: parts.showTranslation.x - 30,

          { at: AT.gotIt, ...parts.gotIt },

      }

      /** Shows a panel's skeleton or entry, and places it by the product's rule. */
      function setPanel(panel, entry, opacity) {
        panel.style.display = 'flex';
        panel.style.opacity = opacity;
        panel.style.visibility = opacity > 0 ? 'visible' : 'hidden';
        panel.querySelector('.loading').style.display = entry
          ? 'none'
          : 'block';
        panel.querySelector('.loaded').style.display = entry ? 'block' : 'none';
        panel.querySelector('.save').style.display = entry ? 'flex' : 'none';
        // The product keeps panels inside the player; the film also keeps them inside the crop.
        const width = panel.offsetWidth;
        const { min, max } = parts.visible;
        panel.style.left = `${Math.max(min, Math.min(panel.placedCenter - width / 2, max - width))}px`;
      }

      function playedSeconds(t) {
        let seconds = 0;
        for (const [start, end] of PLAYING) {
          seconds += clamp((t - start) / (end - start)) * (end - start);
        }
        return seconds;
      }

      function along(route, start, t) {
        let at = start;
        for (const leg of route) {
          if (t < leg.from) break;
          const moved = ramp(t, leg.from, leg.to, easeInOut);
          at = { x: mix(at.x, leg.x, moved), y: mix(at.y, leg.y, moved) };
        }
        return at;
      }

      function drawPointer(
        cursor,
        ring,
        at,
        clicks,
        t,
        shown,
        pressed = false,
      ) {
        const nearest = clicks.find(
          (click) => t >= click.at - 0.1 && t < click.at + 0.45,
        );
        const press = pressed
          ? 0.86
          : 1 -
            (nearest
              ? 0.14 * Math.sin(Math.PI * clamp((t - nearest.at + 0.1) / 0.2))
              : 0);
        cursor.style.opacity = shown ? 1 : 0;
        cursor.style.transform = `translate(${at.x - 3}px, ${at.y - 3}px) scale(${press})`;
        if (shown && nearest && t >= nearest.at) {
          const grow = clamp((t - nearest.at) / 0.42);
          ring.style.opacity = (1 - grow) * 0.85;
          ring.style.transform = `translate(${nearest.x}px, ${nearest.y}px) scale(${mix(0.35, 1.5, easeOut(grow))})`;
        } else {
          ring.style.opacity = 0;
        }
      }

      function render(t) {
        TITLES.forEach((title) => {
          animateTitle(title.element, t, title);
        });

        // Window A: the whole landing page, a push-in on the video, then across to the toolbar.
        const intro = ramp(t, AT.toIcon, AT.toIcon + 0.75, easeInOut);
        const settle = ramp(t, AT.toVideo - 0.2, AT.toVideo + 2.6, easeInOut);
        const across = ramp(t, AT.toToolbar, AT.toToolbar + 1.1, easeInOut);
        const scale = mix(mix(1, SCALE, intro), SCALE, settle);
        const { listing, player, toolbar } = parts.frames;
        const ax = mix(
          mix(mix(listing.x, toolbar.x, intro), player.x, settle),
          toolbar.x,
          across,
        );
        const ay = mix(mix(listing.y, toolbar.y, intro), player.y, settle);

        // One click adds it: the button says so, and the icon arrives in the toolbar.
        const added = t >= AT.addClick + 0.12;
        $('add').classList.toggle('is-added', added);
        $('add-check').style.display = added ? 'block' : 'none';
        $('add-label').textContent = added
          ? 'Added to Chrome'
          : 'Add to Chrome, free';
        const pop = clamp((t - AT.iconPop) / 0.4);
        $('toolbar-icon').style.transform =
          `scale(${t < AT.iconPop ? 0 : easeOut(pop) + 0.35 * Math.sin(Math.PI * pop)})`;
        const pulse = clamp((t - AT.iconPop) / 0.6);
        $('ring-icon').style.opacity =
          t >= AT.iconPop && pulse < 1 ? (1 - pulse) * 0.85 : 0;
        $('ring-icon').style.transform =
          `translate(${parts.icon.x}px, ${parts.icon.y}px) scale(${mix(0.4, 1.4, easeOut(pulse))})`;
        $('listing').style.opacity =
          1 - ramp(t, AT.toVideo - 0.3, AT.toVideo, easeInOut);
        $('address-a').textContent =
          t < AT.toVideo - 0.15
            ? 'coupletapp.com'
            : 'youtube.com/watch?v=hill-town-vlog';
        // The video tab leaves before the Dashboard arrives, so the two never mix.
        const leave = ramp(
          t,
          AT.toDashboard - 0.05,
          AT.toDashboard + 0.2,
          easeInOut,
        );
        $('camera-a').style.transform =
          `translate(${ax}px, ${ay - leave * 40}px) scale(${scale})`;
        $('camera-a').style.opacity = 1 - leave;

        // Window B, the Dashboard tab, rises in its place.
        const arrive = ramp(t, AT.toDashboard + 0.2, AT.toDashboard + 0.55);
        $('camera-b').style.opacity = arrive;
        $('camera-b').style.transform =
          `translate(${parts.cameraB.x}px, ${parts.cameraB.y + mix(60, 0, arrive)}px) scale(${SCALE})`;

        // The vlog moves only while it plays, with a hand's sway on top.
        const video = playedSeconds(t);
        $('hand').setAttribute(
          'transform',
          `translate(${Math.sin(video * 0.9) * 3 + Math.sin(video * 2.3) * 1.2} ${Math.sin(video * 1.3 + 1) * 2.4}) rotate(${Math.sin(video * 0.7) * 0.5} 400 225)`,
        );
        // Up the street, left to right, along its slope.
        const tramX = 210 + video * 14;
        $('tram').setAttribute(
          'transform',
          `translate(${tramX} ${266 + (tramX - 300) * 0.036}) scale(0.5)`,
        );
        $('clouds').setAttribute('transform', `translate(${video * 1.6} 0)`);
        $('glints').setAttribute(
          'opacity',
          0.55 + 0.45 * Math.sin(video * 3.1),
        );
        $('boat').setAttribute(
          'transform',
          `translate(${video * -1.2} ${Math.sin(video * 1.5) * 0.6})`,
        );
        $('gull-a').setAttribute(
          'transform',
          `translate(${120 + video * 9} ${60 + Math.sin(video * 1.8) * 6})`,
        );
        $('gull-b').setAttribute(
          'transform',
          `translate(${300 + video * 7} ${88 + Math.sin(video * 2.2 + 1) * 5})`,
        );
        $('played').style.width = `${10.5 + video * 0.17}%`;
        const seconds = Math.floor(62.3 + video);
        $('clock').textContent =
          `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')} / 9:48`;
        const playing = PLAYING.some(([from, to]) => t >= from && t < to);
        $('toggle').setAttribute(
          'd',
          playing ? 'M7 5h4v14H7zM13 5h4v14h-4z' : 'M8 5v14l11-7z',
        );

        // The current cue: each shows from its start until the next one.
        let current = 0;
        CUES.forEach((cue, at) => {
          if (t >= cue.at) current = at;
        });
        parts.cues.forEach((box, at) => {
          box.style.display = at === current ? 'flex' : 'none';
        });

        // Clicking a word selects it and opens its panel, which later closes.
        const wordOpen = t >= AT.wordClick && t < AT.wordClose;
        parts.wordToken.classList.toggle(
          'is-hover',
          t >= AT.wordClick - 0.3 && t < AT.wordClick,
        );
        parts.wordToken.classList.toggle('is-selected', wordOpen);
        setPanel(
          parts.wordPanel,
          t >= AT.wordEntry,
          wordOpen ? ramp(t, AT.wordClick + 0.03, AT.wordClick + 0.13) : 0,
        );

        // Dragging marks each word the pointer reaches, then the panel opens.
        const pointerA = along(parts.routeA, parts.startA, t);
        const selection = t >= AT.dragStart && t < AT.phraseClose;
        parts.range.forEach((token, at) => {
          const reached =
            at === 0 ? t >= AT.dragStart : t >= (AT.dragStart + AT.dragEnd) / 2;
          token.classList.toggle('is-in-range', selection && reached);
        });
        parts.phraseToken.classList.toggle(
          'is-selected',
          t >= AT.dragEnd && t < AT.phraseClose,
        );
        const phraseOpen = t >= AT.dragEnd + 0.03 && t < AT.phraseClose;
        setPanel(
          parts.phrasePanel,
          t >= AT.phraseEntry,
          phraseOpen ? ramp(t, AT.dragEnd + 0.03, AT.dragEnd + 0.13) : 0,
        );

        // Pressing a star fills it, with a small pop.
        [
          [parts.wordPanel, AT.wordStar],
          [parts.phrasePanel, AT.phraseStar],
        ].forEach(([panel, at]) => {
          const star = panel.querySelector('.save');
          const saved = t >= at;
          star.classList.toggle('is-saved', saved);
          const pop = clamp((t - at) / 0.34);
          star.style.transform = `scale(${saved ? 1 + 0.45 * Math.sin(Math.PI * pop) : 1})`;
        });

        // The toolbar icon opens the Popup.
        const popupShown = t >= AT.iconClick + 0.05 && t < AT.toDashboard + 0.2;
        const popupIn = ramp(t, AT.iconClick + 0.05, AT.iconClick + 0.25);
        $('popup').style.opacity = popupShown ? popupIn : 0;
        $('popup').style.transform = `scale(${mix(0.96, 1, popupIn)})`;

        const shownA =
          (t >= 0.6 && t < AT.toIcon + 0.1) ||
          (t >= 8.8 && t < 12.7) ||
          (t >= 12.95 && t < 16.6) ||
          (t >= 17.25 && t < AT.toDashboard);
        drawPointer(
          $('cursor-a'),
          $('ring-a'),
          pointerA,
          parts.clicksA,
          t,
          shownA,
          t >= AT.dragStart && t < AT.dragEnd,
        );

        // Dashboard pages: one at a time, crossfading.
        let address = PAGES[0].address;
        PAGES.forEach((page) => {
          const fadeIn =
            page.from <= AT.toDashboard
              ? 1
              : ramp(t, page.from, page.from + 0.18);
          const on = t >= page.from && t < page.to + 0.18;
          page.frame.style.opacity = on ? fadeIn : 0;
          page.frame.style.zIndex = on ? 1 : 0;
          if (t >= page.from) address = page.address;
        });
        $('address-b').textContent = address;
        const progress = PAGES.find((page) => page.scene === 'progress').frame;
        progress.contentWindow.scrollTo(
          0,
          parts.progressScroll *
            ramp(t, AT.toProgress + 0.6, AT.toEnd - 0.4, easeInOut),
        );

        const pointerB = along(parts.routeB, parts.startB, t);
        const shownB = t >= 21.0 && t < AT.toProgress;
        drawPointer(
          $('cursor-b'),
          $('ring-b'),
          pointerB,
          parts.clicksB,
          t,
          shownB,
        );

        // The ending: what it is, why it matters, and where to get it.
        $('end').style.opacity = ramp(t, AT.toEnd, AT.toEnd + 0.5, easeInOut);
        const rise = (element, start) => {
          const value = ramp(t, start, start + 0.5);
          element.style.opacity = value;
          element.style.transform = `translateY(${mix(24, 0, value)}px)`;
        };
        rise($('lockup'), AT.toEnd + 0.35);
        rise($('tagline'), AT.toEnd + 0.7);
        $('tagline-rule').style.transform =
          `scaleX(${ramp(t, AT.toEnd + 1.2, AT.toEnd + 1.65, easeInOut)})`;
        rise($('install'), AT.toEnd + 1.4);
        rise($('site'), AT.toEnd + 1.7);
      }

      window.ready = (async () => {
        for (const title of TITLES) title.element = buildTitle(title);
        await mount();
        render(Number(new URLSearchParams(location.search).get('t') ?? 6));
      })();
      window.render = render;
      window.DURATION = DURATION;
    </script>
  </body>
</html>
