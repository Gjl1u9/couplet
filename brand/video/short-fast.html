<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Couplet Short: Fast</title>
    <style>
      /* The third upright film: night, loud type, and a fast review. Its own look, apart
         from the paper films: dark ground, heavy sans, a yellow mark, no browser window. */
      :root {
        --night: #0b0c10;
        --ink: #f4f1ea;
        --dim: #8d93a0;
        --mark: #ffd60a;
        --paper: #fbf8f0;
        --paper-ink: #29251d;
        --paper-muted: #6a6354;
        --paper-line: #d6cdb9;
        --vermilion: #c9401f;
        --heavy:
          -apple-system, 'SF Pro Display', 'Helvetica Neue', 'PingFang TC',
          sans-serif;
        --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: var(--night);
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--night);
      }

      /* Headlines: heavy, left-aligned, slammed in word by word. */
      #heads {
        position: absolute;
        z-index: 5;
        top: 150px;
        right: 120px;
        left: 64px;
        height: 380px;
      }

      .head {
        position: absolute;
        bottom: 0;
        left: 0;
        margin: 0;
        color: var(--ink);
        font-family: var(--heavy);
        font-size: 104px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 108px;
      }

      .head .w {
        display: inline-block;
        white-space: pre;
        transform-origin: 0 80%;
      }

      .head .key {
        position: relative;
        z-index: 0;
        color: var(--night);
      }

      .head .key::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 6px -10px 2px -12px;
        background: var(--mark);
        transform: scaleX(var(--wipe, 0));
        transform-origin: left center;
      }

      /* The player: a 16:9 picture, scaled up and cropped to its middle. */
      #view {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }

      #camera {
        position: absolute;
        top: 0;
        left: 0;
        width: 1000px;
        height: 562px;
        transform-origin: 0 0;
      }

      #player {
        position: absolute;
        inset: 0;
        overflow: hidden;
        isolation: isolate;
        background: #000;
      }

      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #controls {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 70px;
        padding: 30px 16px 0;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      }

      #progress {
        height: 4px;
        background: rgba(255, 255, 255, 0.35);
      }

      #played {
        width: 31%;
        height: 100%;
        background: #ff7a59;
      }

      #overlay {
        position: absolute;
        inset: 0;
      }

      .cursor {
        position: absolute;
        z-index: 6;
        top: 0;
        left: 0;
        width: 30px;
        height: 30px;
        transform-origin: 3px 3px;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
      }

      .ring {
        position: absolute;
        z-index: 5;
        top: 0;
        left: 0;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 3px solid var(--mark);
        border-radius: 50%;
      }

      /* Review: cards race past, each answered as it crosses the middle. */
      #review {
        position: absolute;
        inset: 560px 0 0;
      }

      #lane {
        position: absolute;
        top: 70px;
        left: 0;
        width: 1080px;
        height: 520px;
      }

      .card {
        position: absolute;
        top: 0;
        left: 0;
        width: 780px;
        height: 470px;
        padding: 34px 40px;
        border: 1px solid #857c6a;
        border-radius: 5px;
        background: var(--paper);
        color: var(--paper-ink);
        font-family: var(--heavy);
      }

      .card .src {
        color: var(--paper-muted);
        font-size: 22px;
        line-height: 30px;
      }

      .card .word {
        margin: 26px 0 0;
        font-family: var(--serif);
        font-size: 76px;
        font-weight: 600;
        line-height: 86px;
      }

      .card .dots {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        color: var(--paper-muted);
        font-size: 20px;
      }

      .card .dots i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--paper-line);
      }

      .card .dots i.on {
        background: var(--vermilion);
      }

      .card .cue {
        margin: 30px 0 0;
        font-size: 33px;
        font-weight: 500;
        line-height: 46px;
      }

      .card .cue b {
        color: var(--vermilion);
        font-weight: 600;
        text-decoration: underline 3px;
        text-underline-offset: 7px;
      }

      /* The grade a card got, stamped on as it passes. */
      .stamp {
        position: absolute;
        top: 30px;
        right: 34px;
        padding: 8px 20px;
        border: 4px solid currentColor;
        border-radius: 10px;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        transform-origin: center;
      }

      .stamp.good {
        color: #3f7a4a;
      }

      .stamp.hard {
        color: #9a6a12;
      }

      .stamp.again {
        color: var(--vermilion);
      }

      /* The real grade buttons' look, under the lane. */
      #grades {
        position: absolute;
        top: 680px;
        left: 60px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        width: 880px;
      }

      .grade {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 132px;
        border: 2px solid #3a3f4a;
        border-radius: 22px;
        background: #171a21;
        color: var(--ink);
        font-family: var(--heavy);
      }

      .grade b {
        font-size: 38px;
        font-weight: 700;
        line-height: 48px;
      }

      .grade small {
        color: var(--dim);
        font-size: 25px;
        line-height: 32px;
      }

      .grade.is-pressed {
        border-color: var(--mark);
        background: #2a2614;
      }

      /* Review's answer pill, as the Dashboard shows it above the grades. */
      #pill {
        position: absolute;
        top: 596px;
        left: 0;
        width: 1000px;
        display: flex;
        justify-content: center;
      }

      #pill span {
        padding: 10px 26px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--night);
        font-family: var(--heavy);
        font-size: 30px;
        line-height: 40px;
      }

      #pill strong {
        font-weight: 700;
      }

      /* The words kept: a wall that fills. */
      #wall {
        position: absolute;
        inset: 560px 0 0;
        overflow: hidden;
      }

      #wall-in {
        position: absolute;
        top: 0;
        left: -40px;
        width: 1160px;
        display: flex;
        flex-wrap: wrap;
        align-content: flex-start;
        gap: 6px 26px;
        padding: 20px 40px;
        transform-origin: 50% 30%;
      }

      #wall-in span {
        color: var(--ink);
        font-family: var(--heavy);
        font-size: 40px;
        font-weight: 600;
        line-height: 64px;
        text-decoration: underline dotted var(--mark) 4px;
        text-underline-offset: 9px;
      }

      #wall-in span.dim {
        color: var(--dim);
      }

      #wall-fade {
        position: absolute;
        inset: auto 0 0;
        height: 420px;
        background: linear-gradient(transparent, var(--night) 75%);
      }

      /* The end. */
      #end {
        position: absolute;
        z-index: 8;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        padding: 0 64px 300px;
        background: var(--night);
        color: var(--ink);
        font-family: var(--heavy);
      }

      #lockup {
        display: flex;
        align-items: center;
        gap: 26px;
      }

      #lockup svg {
        width: 112px;
        height: 112px;
      }

      #lockup span {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1;
      }

      #end h2 {
        margin: 70px 0 0;
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 98px;
      }

      #end h2 em {
        position: relative;
        z-index: 0;
        color: var(--night);
        font-style: normal;
      }

      #end h2 em::before {
        content: '';
        position: absolute;
        z-index: -1;
        inset: 6px -10px 2px -12px;
        background: var(--mark);
      }

      #install {
        margin-top: 70px;
        padding: 26px 50px;
        border-radius: 999px;
        background: var(--mark);
        color: var(--night);
        font-size: 44px;
        font-weight: 700;
        line-height: 52px;
      }

      #site {
        margin-top: 30px;
        color: var(--dim);
        font-size: 36px;
        line-height: 44px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="view">
        <div id="camera">
          <div id="player">
            <svg
              id="scene"
              viewBox="0 0 1000 562"
              preserveAspectRatio="xMidYMid slice"
            >
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#0d1430" />
                  <stop offset="1" stop-color="#2a1d3a" />
                </linearGradient>
                <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.55" />
                  <stop offset="1" stop-color="#ffcf7a" stop-opacity="0" />
                </radialGradient>
              </defs>
              <rect width="1000" height="562" fill="url(#sky)" />
              <g id="skyline"></g>
              <g id="stalls"></g>
              <g id="steam"></g>
              <g id="lights"></g>
              <g id="crowd"></g>
              <rect y="470" width="1000" height="92" fill="#16111c" />
            </svg>
            <div id="controls">
              <div id="progress"><div id="played"></div></div>
            </div>
            <div id="overlay"></div>
          </div>
          <div class="ring" id="ring"></div>
          <svg
            class="cursor"
            id="cursor"
            viewBox="0 0 30 30"
            aria-hidden="true"
          >
            <path
              d="M3 3l8.2 22 3.6-8.6L23.6 13z"
              fill="#ffffff"
              stroke="#15181e"
              stroke-width="1.6"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <div id="review">
        <div id="lane"></div>
        <div id="pill"><span></span></div>
        <div id="grades">
          <div class="grade" data-grade="again">
            <b>Forgot</b><small>10 min</small>
          </div>
          <div class="grade" data-grade="hard">
            <b>Unsure</b><small>1 day</small>
          </div>
          <div class="grade" data-grade="good">
            <b>Got it</b><small>3 days</small>
          </div>
        </div>
      </div>

      <div id="wall">
        <div id="wall-in"></div>
        <div id="wall-fade"></div>
      </div>

      <div id="heads"></div>

      <div id="end">
        <div id="lockup">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path
              fill="#f4f1ea"
              d="M15 4H31A11 11 0 0 1 42 15V22H33A11 11 0 0 0 22 33V42H15A11 11 0 0 1 4 31V15A11 11 0 0 1 15 4Z"
            />
            <path
              fill="#ff7a59"
              d="M42 22H49A11 11 0 0 1 60 33V49A11 11 0 0 1 49 60H33A11 11 0 0 1 22 49V42H31A11 11 0 0 0 42 31Z"
            />
          </svg>
          <span>Couplet</span>
        </div>
        <h2>Dual subtitles<br />for YouTube.<br /><em>Free.</em></h2>
        <div id="install">Add to Chrome, free</div>
        <div id="site">coupletapp.com</div>
      </div>
    </div>

    <script>
      const DURATION = 25;
      // The player is scaled up and cropped to its middle, so the subtitles fill the width.
      const SCALE = 1.9;
      const TOP = 560;
      // Where the picture centres: a little left, clear of the feed's buttons on the right.
      const CENTRE = 520;
      // The canvas columns kept clear of the feed's own buttons.
      const SAFE = { left: 60, right: 950 };

      // Every moment in one place.
      const AT = {
        cue1: 2.3,
        wordClick: 4.55,
        wordEntry: 4.95,
        star: 6.2,
        explainClick: 8.25,
        explainText: 9.05,
        toReview: 12.6,
        reviewEnd: 18.2,
        toWall: 18.2,
        toEnd: 21.8,
      };

      const HEADS = [
        {
          words: ['Dual', 'subtitles.'],
          key: ['Free.'],
          start: 0.05,
          leave: 3.9,
        },
        { words: ['Tap', 'any'], key: ['word.'], start: 4.1, leave: 7.9 },
        {
          words: ['Ask', 'AI', 'what', 'it'],
          key: ['means', 'here.'],
          start: 8.05,
          leave: 12.3,
        },
        {
          words: ['Then', 'review.'],
          key: ['Fast.'],
          start: 12.6,
          leave: 18.0,
        },
        { words: ['Keep', 'every'], key: ['word.'], start: 18.3, leave: 21.6 },
      ];

      const CUES = [
        {
          at: 0,
          original: 'This is the busiest night market in town.',
          translation: '這是城裡最熱鬧的夜市。',
        },
        {
          at: AT.cue1,
          original: 'The smells here are overwhelming.',
          translation: '這裡的味道多到讓人招架不住。',
        },
      ];

      const EXPLANATION =
        '這裡的 overwhelming 是形容詞，指夜市的味道又多又濃，一時應付不來。語氣是驚嘆，不是抱怨，像在說「哇，也太多了吧」。';

      // Review cards race past; each gets its grade as it crosses the middle.
      const REVIEW = [
        ['overwhelming', 'The smells here are overwhelming.', 'good'],
        ['bustling', 'The streets were bustling with people.', 'good'],
        ['haggle', 'You can haggle over the price.', 'again'],
        ['skewer', 'Grab a skewer of grilled squid.', 'good'],
        ['crispy', 'The edges are perfectly crispy.', 'hard'],
        ['vendor', 'Every vendor has a secret recipe.', 'good'],
        ['queue', 'The queue goes around the block.', 'good'],
        ['savory', 'I prefer savory snacks at night.', 'again'],
        ['aroma', 'Follow the aroma of fresh bread.', 'good'],
        ['sizzle', 'Listen to the oil sizzle.', 'hard'],
        ['bargain', 'Ten dollars? That is a bargain.', 'good'],
        ['chewy', 'The noodles are thick and chewy.', 'good'],
        ['lantern', 'Red lanterns hang over every stall.', 'good'],
        ['festive', 'The whole place feels festive.', 'hard'],
        ['browse', 'We could browse here for hours.', 'good'],
        ['craving', 'I have a craving for something sweet.', 'good'],
        ['stroll', 'Let us stroll to the other end.', 'again'],
        ['tender', 'The pork is slow-cooked and tender.', 'good'],
      ];
      const GRADE = {
        again: { label: 'Forgot', next: '10 min' },
        hard: { label: 'Unsure', next: '1 day' },
        good: { label: 'Got it', next: '3 days' },
      };
      const CARD_GAP = 840;
      const REVIEW_SPAN = AT.reviewEnd - AT.toReview - 0.4;
      /** Cards passed so far: slow at first, then faster and faster. */
      const passed = (t) => {
        const tau = Math.max(0, t - AT.toReview - 0.35);
        const a = 0.75;
        const b = (REVIEW.length - 1.2 - a * REVIEW_SPAN) / REVIEW_SPAN ** 2;
        return Math.min(REVIEW.length - 1, a * tau + b * tau * tau);
      };

      const clamp = (value) => Math.min(1, Math.max(0, value));
      const easeOut = (value) => 1 - (1 - value) ** 3;
      const easeInOut = (value) =>
        value < 0.5 ? 4 * value ** 3 : 1 - (-2 * value + 2) ** 3 / 2;
      const ramp = (t, start, end, ease = easeOut) =>
        ease(clamp((t - start) / (end - start)));
      const mix = (from, to, amount) => from + (to - from) * amount;
      const $ = (id) => document.getElementById(id);
      const parts = {};

      let seed = 11;
      const random = () => {
        seed = (seed * 16807) % 2147483647;
        return seed / 2147483647;
      };
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const svg = (tag, attributes) => {
        const node = document.createElementNS(SVG_NS, tag);
        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, String(value));
        }
        return node;
      };

      /** A night market, drawn here so nothing needs a license. */
      function buildMarket() {
        const skyline = $('skyline');
        for (let x = -20; x < 1020; x += 46 + random() * 30) {
          const height = 120 + random() * 170;
          const width = 40 + random() * 40;
          skyline.append(
            svg('rect', {
              x,
              y: 330 - height,
              width,
              height: height + 40,
              fill: '#1a1830',
            }),
          );
          for (let wy = 330 - height + 14; wy < 340; wy += 22) {
            for (let wx = x + 8; wx < x + width - 10; wx += 16) {
              if (random() < 0.35) {
                skyline.append(
                  svg('rect', {
                    x: wx,
                    y: wy,
                    width: 6,
                    height: 9,
                    fill: '#e8c27a',
                    opacity: 0.5,
                  }),
                );
              }
            }
          }
        }
        const stalls = $('stalls');
        const awnings = ['#c9401f', '#e0a33a', '#2f7d6d', '#b8325c', '#d8692b'];
        parts.stallGlows = [];
        for (let i = 0; i < 6; i += 1) {
          const x = -40 + i * 180;
          const colour = awnings[i % awnings.length];
          stalls.append(
            svg('rect', {
              x: x + 6,
              y: 330,
              width: 160,
              height: 150,
              fill: '#2b2230',
            }),
          );
          const glow = svg('ellipse', {
            cx: x + 86,
            cy: 400,
            rx: 110,
            ry: 70,
            fill: 'url(#glow)',
          });
          parts.stallGlows.push(glow);
          stalls.append(glow);
          for (let s = 0; s < 8; s += 1) {
            stalls.append(
              svg('rect', {
                x: x + s * 21,
                y: 300,
                width: 21,
                height: 34,
                fill: s % 2 ? '#f4ead6' : colour,
              }),
            );
          }
          stalls.append(
            svg('path', { d: `M${x} 334h168l-8 10h-152z`, fill: colour }),
          );
          stalls.append(
            svg('rect', {
              x: x + 16,
              y: 420,
              width: 140,
              height: 14,
              fill: '#4a3a3a',
            }),
          );
          for (let f = 0; f < 5; f += 1) {
            stalls.append(
              svg('circle', {
                cx: x + 30 + f * 27,
                cy: 416,
                r: 8,
                fill: ['#f2b544', '#e06a3b', '#f7e3b0', '#c8553d', '#f0c27a'][
                  f
                ],
              }),
            );
          }
        }
        const lights = $('lights');
        parts.bulbs = [];
        for (const [y0, sag] of [
          [150, 40],
          [210, 30],
        ]) {
          lights.append(
            svg('path', {
              d: `M-10 ${y0} Q500 ${y0 + sag * 2} 1010 ${y0}`,
              stroke: '#3b3346',
              'stroke-width': 2,
              fill: 'none',
            }),
          );
          for (let x = 10; x < 1000; x += 38) {
            const u = (x + 10) / 1020;
            const y =
              (1 - u) ** 2 * y0 + 2 * (1 - u) * u * (y0 + sag * 2) + u * u * y0;
            const bulb = svg('circle', {
              cx: x,
              cy: y + 7,
              r: 5,
              fill: '#ffd98a',
            });
            bulb.phase = random() * Math.PI * 2;
            parts.bulbs.push(bulb);
            lights.append(bulb);
          }
        }
        for (const x of [120, 470, 820]) {
          lights.append(
            svg('line', {
              x1: x,
              y1: 0,
              x2: x,
              y2: 230,
              stroke: '#3b3346',
              'stroke-width': 2,
            }),
          );
          lights.append(
            svg('ellipse', { cx: x, cy: 250, rx: 22, ry: 26, fill: '#d6402a' }),
          );
          lights.append(
            svg('rect', {
              x: x - 10,
              y: 222,
              width: 20,
              height: 6,
              fill: '#f2b544',
            }),
          );
        }
        const steam = $('steam');
        parts.puffs = [];
        for (let i = 0; i < 14; i += 1) {
          const puff = svg('circle', {
            r: 14 + random() * 14,
            fill: '#e9e3f2',
          });
          puff.base = { x: 60 + random() * 880, delay: random() * 3 };
          parts.puffs.push(puff);
          steam.append(puff);
        }
        const crowd = $('crowd');
        parts.people = [];
        for (let i = 0; i < 12; i += 1) {
          const g = svg('g', {});
          const tone = ['#0f0c14', '#151019', '#1c1520'][i % 3];
          g.append(svg('circle', { cx: 0, cy: -118, r: 17, fill: tone }));
          g.append(
            svg('path', { d: 'M-24 0v-80q0-24 24-24t24 24v80z', fill: tone }),
          );
          g.base = {
            x: random() * 1100 - 50,
            speed: (random() < 0.5 ? -1 : 1) * (14 + random() * 22),
            y: 520 + random() * 40,
            s: 0.8 + random() * 0.45,
          };
          parts.people.push(g);
          crowd.append(g);
        }
      }

      function drawMarket(seconds) {
        parts.bulbs.forEach((bulb) => {
          bulb.setAttribute(
            'opacity',
            0.65 + 0.35 * Math.sin(seconds * 2.2 + bulb.phase),
          );
        });
        parts.stallGlows.forEach((glow, at) => {
          glow.setAttribute(
            'opacity',
            0.8 + 0.2 * Math.sin(seconds * 1.3 + at),
          );
        });
        parts.puffs.forEach((puff) => {
          const life = ((seconds + puff.base.delay) % 3) / 3;
          puff.setAttribute('cx', puff.base.x + Math.sin(life * 6) * 10);
          puff.setAttribute('cy', 410 - life * 160);
          puff.setAttribute('opacity', 0.22 * Math.sin(Math.PI * life));
        });
        parts.people.forEach((person) => {
          const { x, speed, y, s } = person.base;
          const px = ((((x + speed * seconds) % 1100) + 1100) % 1100) - 50;
          const bob = Math.abs(Math.sin(seconds * 5 + x)) * 4;
          person.setAttribute(
            'transform',
            `translate(${px} ${y - bob}) scale(${s})`,
          );
        });
      }

      const icon = (paths, className = 'icon') =>
        `<svg class="${className}" viewBox="0 0 24 24" aria-hidden="true">${paths
          .map((d) => `<path d="${d}"></path>`)
          .join('')}</svg>`;
      const ICON = {
        speak: [
          'M15 8a5 5 0 0 1 0 8',
          'M17.7 5a9 9 0 0 1 0 14',
          'M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5',
        ],
        star: [
          'M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873l-6.158 -3.245',
        ],
        known: [
          'M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0',
          'M8.5 12.2l2.4 2.4l4.6 -5',
        ],
      };

      const sense = (meaning, example, translation) => `
        <div class="lookup-sense">
          <div class="lookup-meaning"><span class="meaning-chip">${meaning}</span></div>
          <div class="couplet-original">${example}</div>
          <div class="couplet-translation">${translation}</div>
        </div>`;

      /** A cue as the overlay shows it: words are tokens, and punctuation is not. */
      const cueBox = ({ original, translation }) => {
        const box = document.createElement('div');
        box.className = 'box is-raised';
        const tokens = original
          .split(' ')
          .map((word) => {
            const [, text, tail] = word.match(/^(.*?)([.,!?]*)$/);
            return `<button class="token" type="button">${text}</button>${tail}`;
          })
          .join(' ');
        box.innerHTML = `
          <div class="strip">
            <div class="original" lang="en">${tokens}</div>
            <div class="translation" lang="zh-Hant">${translation}</div>
          </div>`;
        return box;
      };

      const stylesheet = (root, href) => {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        return new Promise((resolve, reject) => {
          link.onload = resolve;
          link.onerror = reject;
          root.append(link);
        });
      };

      function buildHeads() {
        HEADS.forEach((head) => {
          const element = document.createElement('h1');
          element.className = 'head';
          const add = (text, isKey) => {
            const span = document.createElement('span');
            span.className = isKey ? 'w key' : 'w';
            span.textContent = text;
            element.append(span, document.createTextNode(' '));
            return span;
          };
          head.words.forEach((text) => add(text, false));
          element.append(document.createElement('br'));
          // The key words share one highlight.
          add(head.key.join(' '), true);
          $('heads').append(element);
          head.element = element;
        });
      }

      function drawHead(head, t) {
        const words = [...head.element.querySelectorAll('.w')];
        words.forEach((word, at) => {
          const from = head.start + at * 0.09;
          const shown = ramp(t, from, from + 0.16);
          // A slam: big and see-through, then settled.
          word.style.opacity = shown;
          word.style.transform = `scale(${mix(1.6, 1, shown)})`;
          if (word.classList.contains('key')) {
            word.style.setProperty(
              '--wipe',
              ramp(t, from + 0.1, from + 0.35, easeInOut),
            );
          }
        });
        const gone = t >= head.leave;
        head.element.style.opacity = t < head.start || gone ? 0 : 1;
      }

      function buildCards() {
        parts.cards = REVIEW.map(([word, cue, grade]) => {
          const card = document.createElement('div');
          card.className = 'card';
          const marked = cue.replace(word, `<b>${word}</b>`);
          const level = Math.floor(random() * 5);
          card.innerHTML = `
            <div class="src">▶ Back to video · Night market food tour</div>
            <div class="word">${word}</div>
            <div class="dots">${Array.from({ length: 7 }, (_, i) => `<i class="${i <= level ? 'on' : ''}"></i>`).join('')}</div>
            <p class="cue">${marked}</p>
            <div class="stamp ${grade}">${GRADE[grade].label}</div>`;
          $('lane').append(card);
          return { card, word, grade, stamp: card.querySelector('.stamp') };
        });
      }

      async function buildWall() {
        const text = await (
          await fetch('../../public/frequency/en.txt')
        ).text();
        const list = text.split('\n').slice(3000, 16000);
        const wall = $('wall-in');
        parts.wallWords = [];
        for (let i = 0; i < 230; i += 1) {
          const span = document.createElement('span');
          span.textContent = list[Math.floor(random() * list.length)];
          if (random() < 0.3) span.className = 'dim';
          span.order = random();
          wall.append(span);
          parts.wallWords.push(span);
        }
        // They appear in a scattered order, faster and faster.
        const order = [...parts.wallWords].sort((a, b) => a.order - b.order);
        order.forEach((span, at) => {
          span.showAt = AT.toWall + 0.15 + 2.6 * Math.sqrt(at / order.length);
        });
      }

      async function mount() {
        buildMarket();
        buildHeads();
        buildCards();
        await buildWall();
        const overlay = $('overlay').attachShadow({ mode: 'open' });
        const loaded = ['tokens', 'lookup-panel', 'overlay'].map((name) =>
          stylesheet(overlay, `../../src/lib/ui/${name}.css`),
        );
        parts.cues = CUES.map((cue) => {
          const box = cueBox(cue);
          box.style.display = 'none';
          return box;
        });
        const panel = document.createElement('div');
        panel.className = 'panel lookup-panel';
        panel.dataset.theme = 'dark';
        panel.innerHTML = `
          <div class="lookup-head">
            <div class="lookup-title">
              <span class="lookup-word">overwhelming</span>
              <span class="phonetic">/ˌoʊvərˈwelmɪŋ/</span>
            </div>
            <div class="lookup-actions">
              <button class="icon-button save" type="button">${icon(ICON.star)}</button>
              <button class="icon-button speak" type="button">${icon(ICON.speak)}</button>
            </div>
          </div>
          <div class="lookup-senses" lang="zh-Hant">
            <div class="loading">
              <div class="skeleton lookup-skeleton"></div>
              <div class="skeleton lookup-skeleton is-long"></div>
            </div>
            <div class="loaded">
              ${sense('壓倒性的', 'The response was overwhelming.', '反應熱烈到難以招架。')}
              ${sense('令人難以承受的', 'She felt an overwhelming sadness.', '她感到一股難以承受的悲傷。')}
            </div>
          </div>
          <div class="lookup-explain" lang="zh-Hant">
            <div class="explain-skeleton"><span></span><span></span><span></span></div>
            <div class="explain-done">
              <p class="explain-text" dir="auto">${EXPLANATION}</p>
              <p class="explain-note">AI can make mistakes · 49 left today</p>
            </div>
          </div>
          <div class="lookup-foot">
            <button class="known-action" type="button">${icon(ICON.known)}<span>I know this</span></button>
            <button class="known-action explain-action" type="button">${icon(SPARKLES, 'icon ai-icon')}<span class="explain-label">Explain with AI</span><span class="beta">Beta</span></button>
          </div>`;
        const extra = document.createElement('style');
        // The Large subtitle size, and :hover stand-ins, since a rendered frame has no pointer.
        extra.textContent = `
          :host { --subtitle-scale: 0.96 !important; }
          * { transition: none !important; animation: none !important; }
          .token { color: inherit; font: inherit; }
          .token.is-hover::before { background: rgba(255, 255, 255, 0.18); }
          .known-action.is-hover { background: var(--accent-soft); color: var(--ink); }
          .panels { position: absolute; inset: 0; }`;
        const panels = document.createElement('div');
        panels.className = 'panels';
        panels.append(panel);
        overlay.append(extra, ...parts.cues, panels);
        await Promise.all(loaded);
        await document.fonts.ready;

        parts.panel = panel;
        const box = parts.cues[1];
        box.style.display = 'flex';
        const tokens = box.querySelectorAll('.token');
        parts.token = tokens[tokens.length - 1];
        const origin = $('player').getBoundingClientRect();
        const tokenBox = parts.token.getBoundingClientRect();
        const strip = box.querySelector('.strip').getBoundingClientRect();
        parts.word = {
          x: tokenBox.left - origin.left + tokenBox.width / 2,
          y: tokenBox.top - origin.top + tokenBox.height / 2,
        };
        parts.panelBottom = origin.bottom - strip.top + 14;
        parts.token.style.setProperty(
          '--leader',
          `${tokenBox.top - strip.top + 14}px`,
        );
        parts.playerX = CENTRE - 500 * SCALE;
        parts.visible = {
          min: Math.max(16, (SAFE.left - parts.playerX) / SCALE),
          max: Math.min(1000 - 16, (SAFE.right - parts.playerX) / SCALE),
        };
        setPanel({ entry: true, explain: 'done', opacity: 1 });
        parts.panelTopDone = panel.getBoundingClientRect().top - origin.top;
        const where = (element) => {
          const b = element.getBoundingClientRect();
          return {
            x: b.left - origin.left + b.width / 2,
            y: b.top - origin.top + b.height / 2,
          };
        };
        // Measured as the panel stands when each is clicked: before the explanation opens.
        setPanel({ entry: true, explain: null, opacity: 1 });
        parts.star = where(panel.querySelector('.save'));
        parts.explainButton = where(panel.querySelector('.explain-action'));
        const full = panel.getBoundingClientRect();
        parts.panelCentre = { x: full.left - origin.left + full.width / 2 };
        box.style.display = 'none';

        parts.route = [
          { from: 3.6, to: 4.3, x: parts.word.x - 4, y: parts.word.y + 4 },
          { from: 5.5, to: 6.0, x: parts.star.x, y: parts.star.y + 2 },
          {
            from: 7.4,
            to: 8.05,
            x: parts.explainButton.x - 40,
            y: parts.explainButton.y + 2,
          },
          {
            from: 9.0,
            to: 9.7,
            x: parts.explainButton.x + 160,
            y: parts.explainButton.y + 90,
          },
        ];
        parts.clicks = [
          { at: AT.wordClick, ...parts.word },
          { at: AT.star, ...parts.star },
          {
            at: AT.explainClick,
            x: parts.explainButton.x - 40,
            y: parts.explainButton.y,
          },
        ];
      }

      // The filled sparkles of Explain with AI, from src/lib/ui/dom.ts.
      const SPARKLES = [
        'M17.964 2.733c.156 .563 .312 1 .484 1.353c.342 .71 .758 1.125 1.47 1.467c.353 .17 .79 .326 1.352 .484c.98 .276 .97 1.668 -.013 1.93a8.3 8.3 0 0 0 -1.34 .481c-.71 .342 -1.127 .757 -1.463 1.453a8 8 0 0 0 -.486 1.352c-.258 .988 -1.658 1 -1.932 .015c-.156 -.565 -.312 -1.002 -.484 -1.354c-.342 -.71 -.758 -1.124 -1.458 -1.46a8 8 0 0 0 -1.374 -.495a.4 .4 0 0 1 -.06 -.02l-.044 -.017l-.045 -.02l-.049 -.025l-.035 -.02a.4 .4 0 0 1 -.049 -.03l-.032 -.023l-.043 -.034l-.033 -.028l-.036 -.035l-.034 -.035l-.028 -.033l-.035 -.043l-.022 -.032a.4 .4 0 0 1 -.032 -.049l-.02 -.035l-.025 -.05l-.02 -.044l-.017 -.043a.4 .4 0 0 1 -.02 -.06l-.01 -.034a.5 .5 0 0 1 -.02 -.098l-.006 -.065l-.005 -.035v-.05a.4 .4 0 0 1 .003 -.085a.5 .5 0 0 1 .013 -.093a.5 .5 0 0 1 .024 -.103a.4 .4 0 0 1 .02 -.06l.017 -.044l.02 -.045l.025 -.049l.02 -.035a.4 .4 0 0 1 .03 -.049l.023 -.032l.034 -.043l.028 -.033l.035 -.036l.035 -.034q .015 -.015 .033 -.028l.043 -.035l.032 -.022a.4 .4 0 0 1 .049 -.032l.035 -.02l.05 -.025l.044 -.02l.043 -.017a.4 .4 0 0 1 .06 -.02l.027 -.008a8.3 8.3 0 0 0 1.339 -.48c.71 -.342 1.127 -.757 1.47 -1.466c.17 -.354 .327 -.792 .483 -1.355c.272 -.976 1.657 -.976 1.928 0',
        'M10.965 6.737q .219 .801 .503 1.574c.856 2.28 1.945 3.363 4.23 4.22q .708 .265 1.571 .506c.976 .272 .974 1.656 -.002 1.927q -.798 .221 -1.568 .504c-2.288 .858 -3.376 1.94 -4.229 4.216a19 19 0 0 0 -.505 1.579c-.268 .983 -1.662 .983 -1.93 0a19 19 0 0 0 -.503 -1.574c-.856 -2.281 -1.944 -3.363 -4.226 -4.219a20 20 0 0 0 -1.594 -.513a.4 .4 0 0 1 -.054 -.018l-.044 -.017l-.043 -.02a.3 .3 0 0 1 -.048 -.024l-.036 -.02a.4 .4 0 0 1 -.048 -.03l-.032 -.024l-.044 -.034l-.033 -.029l-.037 -.034l-.034 -.037l-.03 -.033l-.033 -.044l-.023 -.032a.4 .4 0 0 1 -.03 -.048l-.021 -.036a.3 .3 0 0 1 -.024 -.048l-.02 -.043l-.017 -.044a.4 .4 0 0 1 -.018 -.054a.2 .2 0 0 1 -.01 -.039a.4 .4 0 0 1 -.014 -.059l-.007 -.04l-.007 -.056l-.003 -.044l-.002 -.05v-.05q 0 -.023 .004 -.044q .001 -.03 .007 -.057l.007 -.04a.4 .4 0 0 1 .017 -.076l.007 -.021a.4 .4 0 0 1 .018 -.054l.017 -.044l.02 -.043a.3 .3 0 0 1 .024 -.048l.02 -.036a.4 .4 0 0 1 .03 -.048l.024 -.032l.034 -.044l.029 -.033l.034 -.037l.037 -.034l.033 -.03l.044 -.033l.032 -.023a.4 .4 0 0 1 .048 -.03l.036 -.021a.3 .3 0 0 1 .048 -.024l.043 -.02l.044 -.017a.4 .4 0 0 1 .054 -.018l.021 -.007a20 20 0 0 0 1.568 -.504c2.287 -.858 3.375 -1.94 4.229 -4.216a19 19 0 0 0 .505 -1.579c.268 -.983 1.662 -.983 1.93 0',
      ];

      /** The panel's state: skeleton or entry, and its explanation closed, loading, or done. */
      function setPanel({ entry, explain, opacity }) {
        const panel = parts.panel;
        panel.style.display = 'flex';
        panel.style.opacity = opacity;
        panel.style.visibility = opacity > 0 ? 'visible' : 'hidden';
        panel.style.bottom = `${parts.panelBottom}px`;
        panel.querySelector('.loading').style.display = entry
          ? 'none'
          : 'block';
        panel.querySelector('.loaded').style.display = entry ? 'block' : 'none';
        panel.querySelector('.save').style.display = entry ? 'flex' : 'none';
        panel.querySelector('.lookup-foot').style.display = entry
          ? 'flex'
          : 'none';
        const box = panel.querySelector('.lookup-explain');
        box.hidden = !explain;
        box.style.display = explain ? 'block' : 'none';
        box.querySelector('.explain-skeleton').style.display =
          explain === 'loading' ? 'grid' : 'none';
        box.querySelector('.explain-done').style.display =
          explain === 'done' ? 'block' : 'none';
        const label = panel.querySelector('.explain-label');
        label.textContent = explain ? 'Hide explanation' : 'Explain with AI';
        panel.querySelector('.beta').style.display = explain ? 'none' : '';
        const width = panel.offsetWidth;
        const { min, max } = parts.visible;
        const centre = parts.word.x;
        panel.style.left = `${Math.max(min, Math.min(centre - width / 2, max - width))}px`;
      }

      function along(route, start, t) {
        let at = start;
        for (const leg of route) {
          if (t < leg.from) break;
          const moved = ramp(t, leg.from, leg.to, easeInOut);
          at = { x: mix(at.x, leg.x, moved), y: mix(at.y, leg.y, moved) };
        }
        return at;
      }

      function render(t) {
        HEADS.forEach((head) => drawHead(head, t));

        // The player: on from the start, gone when review takes over.
        const inPlayer = t < AT.toReview;
        $('view').style.display = inPlayer ? 'block' : 'none';
        const playing = t < AT.wordClick;
        const seconds = playing ? t : AT.wordClick;
        drawMarket(seconds);
        $('controls').style.opacity = playing ? 0 : 1;

        // A punch-in on each cut, then a push on the panel while the AI answers.
        const punch = 1 + 0.05 * (1 - ramp(t, 0, 0.35));
        const push = ramp(
          t,
          AT.explainClick - 0.1,
          AT.explainText + 0.4,
          easeInOut,
        );
        const scale = SCALE * punch * mix(1, 1.12, push);
        const focusX = mix(500, parts.panelCentre.x, push);
        const x = CENTRE - focusX * scale;
        // The push keeps the whole panel below the headline.
        const pushedY = Math.min(
          TOP,
          TOP + 40 - parts.panelTopDone * SCALE * 1.12,
        );
        const y = mix(TOP, pushedY, push);
        $('camera').style.transform =
          `translate(${x}px, ${y}px) scale(${scale})`;

        let current = 0;
        CUES.forEach((cue, at) => {
          if (t >= cue.at) current = at;
        });
        parts.cues.forEach((box, at) => {
          box.style.display = at === current ? 'flex' : 'none';
        });
        // The hint marks the word worth learning, until it is opened.
        parts.token.classList.toggle('is-hinted', t < AT.wordClick);
        parts.token.classList.toggle(
          'is-hover',
          t >= AT.wordClick - 0.3 && t < AT.wordClick,
        );
        parts.token.classList.toggle('is-selected', t >= AT.wordClick);
        parts.token.classList.toggle('is-marked', t >= AT.star);

        const open = t >= AT.wordClick;
        const explain =
          t < AT.explainClick ? null : t < AT.explainText ? 'loading' : 'done';
        setPanel({
          entry: t >= AT.wordEntry,
          explain,
          opacity: open ? ramp(t, AT.wordClick + 0.03, AT.wordClick + 0.13) : 0,
        });
        const star = parts.panel.querySelector('.save');
        star.classList.toggle('is-saved', t >= AT.star);
        const pop = clamp((t - AT.star) / 0.34);
        star.style.transform = `scale(${t >= AT.star ? 1 + 0.45 * Math.sin(Math.PI * pop) : 1})`;
        parts.panel
          .querySelector('.explain-action')
          .classList.toggle(
            'is-hover',
            t >= AT.explainClick - 0.3 && t < AT.explainClick + 0.2,
          );

        // The pointer.
        const at = along(parts.route, { x: 760, y: 470 }, t);
        const near = parts.clicks.find(
          (c) => t >= c.at - 0.1 && t < c.at + 0.45,
        );
        const press =
          1 -
          (near
            ? 0.14 * Math.sin(Math.PI * clamp((t - near.at + 0.1) / 0.2))
            : 0);
        $('cursor').style.opacity = t > 3.4 && inPlayer ? 1 : 0;
        $('cursor').style.transform =
          `translate(${at.x - 3}px, ${at.y - 3}px) scale(${press / Math.sqrt(scale / SCALE)})`;
        const ring = $('ring');
        if (near && t >= near.at) {
          const grow = clamp((t - near.at) / 0.42);
          ring.style.opacity = (1 - grow) * 0.9;
          ring.style.transform = `translate(${near.x}px, ${near.y}px) scale(${mix(0.35, 1.5, easeOut(grow))})`;
        } else {
          ring.style.opacity = 0;
        }

        // Review: the lane races, each card stamped as it crosses the middle.
        const inReview = t >= AT.toReview && t < AT.reviewEnd;
        $('review').style.display = inReview ? 'block' : 'none';
        if (inReview) {
          const n = passed(t);
          const reviewIn = ramp(t, AT.toReview, AT.toReview + 0.25);
          parts.cards.forEach(({ card, stamp, grade }, i) => {
            const centreX = 540 + (i - n) * CARD_GAP;
            card.style.transform = `translate(${centreX - 390 - 20}px, ${mix(60, 0, reviewIn)}px)`;
            card.style.opacity = reviewIn;
            const stampedAt = n - i;
            stamp.style.opacity = stampedAt > -0.12 ? 1 : 0;
            const slam = clamp((stampedAt + 0.12) / 0.18);
            stamp.style.transform = `rotate(-8deg) scale(${mix(1.8, 1, slam)})`;
          });
          // The last card stamped: its grade is pressed, and the pill says what it did.
          const latest = Math.max(
            0,
            Math.min(REVIEW.length - 1, Math.floor(n + 0.12)),
          );
          const card = parts.cards[latest];
          document.querySelectorAll('.grade').forEach((button) => {
            button.classList.toggle(
              'is-pressed',
              button.dataset.grade === card.grade && n > 0.3,
            );
          });
          const pill = $('pill').querySelector('span');
          pill.innerHTML = `<strong>${card.word}</strong> · back in ${GRADE[card.grade].next}`;
          $('pill').style.opacity = n > 0.3 ? 1 : 0;
        }

        // The wall of kept words.
        const inWall = t >= AT.toWall && t < AT.toEnd;
        $('wall').style.display = inWall ? 'block' : 'none';
        if (inWall) {
          parts.wallWords.forEach((span) => {
            const shown = ramp(t, span.showAt, span.showAt + 0.12);
            span.style.opacity = shown;
          });
          const back = ramp(t, AT.toWall, AT.toEnd, (v) => v);
          $('wall-in').style.transform = `scale(${mix(1.08, 0.9, back)})`;
        }

        // The end.
        const endIn = ramp(t, AT.toEnd, AT.toEnd + 0.3);
        $('end').style.display = t >= AT.toEnd ? 'flex' : 'none';
        $('end').style.opacity = endIn;
        [...$('end').children].forEach((child, at) => {
          const shown = ramp(
            t,
            AT.toEnd + 0.1 + at * 0.12,
            AT.toEnd + 0.4 + at * 0.12,
          );
          child.style.opacity = shown;
          child.style.transform = `translateY(${mix(40, 0, shown)}px)`;
        });
      }

      window.ready = (async () => {
        await mount();
        render(0);
      })();
      window.render = render;
      window.DURATION = DURATION;
    </script>
  </body>
</html>
